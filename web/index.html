<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>webo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='3' width='20' height='9' rx='3' fill='%234f8bff'/%3E%3Crect x='2' y='14' width='20' height='7' rx='3' fill='%237c5cff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --accent: #4f8bff;
    --accent-2: #7c5cff;
    --page:
      radial-gradient(1200px 700px at 12% -10%, #10254f 0%, rgba(16, 37, 79, 0) 60%),
      radial-gradient(900px 600px at 92% 8%, #123a6b 0%, rgba(18, 58, 107, 0) 55%),
      linear-gradient(180deg, #05080f 0%, #060c1a 45%, #081431 100%);
    --surface: rgba(255, 255, 255, 0.045);
    --surface-2: rgba(255, 255, 255, 0.075);
    --surface-3: rgba(255, 255, 255, 0.11);
    --card: linear-gradient(180deg, rgba(255, 255, 255, 0.062), rgba(255, 255, 255, 0.028));
    --stroke: rgba(255, 255, 255, 0.085);
    --stroke-strong: rgba(255, 255, 255, 0.2);
    --text: #eaf0fd;
    --text-2: #a2b4d4;
    --text-3: #6f83a5;
    --accent-soft: rgba(79, 139, 255, 0.16);
    --sh: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 10px 24px -14px rgba(0, 0, 0, 0.7);
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --ok: #3fca7c;
    --ok-soft: rgba(63, 202, 124, 0.14);
    --danger: #e5484d;
    --spark-ring: #0a1226;
  }
  [data-theme="light"] {
    --page:
      radial-gradient(1000px 600px at 8% -10%, #dfe9ff 0%, rgba(223, 233, 255, 0) 60%),
      radial-gradient(900px 600px at 95% 0%, #e6f0ff 0%, rgba(230, 240, 255, 0) 55%),
      linear-gradient(180deg, #f4f7fd 0%, #eaf0fa 100%);
    --surface: rgba(255, 255, 255, 0.62);
    --surface-2: rgba(255, 255, 255, 0.82);
    --surface-3: rgba(15, 32, 68, 0.06);
    --card: linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.72));
    --stroke: rgba(15, 32, 68, 0.09);
    --stroke-strong: rgba(15, 32, 68, 0.2);
    --text: #0f1c33;
    --text-2: #4c6183;
    --text-3: #7c8dab;
    --accent-soft: rgba(31, 107, 255, 0.12);
    --sh: 0 1px 2px rgba(20, 40, 80, 0.06), 0 8px 20px -14px rgba(20, 40, 80, 0.35);
    --spark-ring: #eef3fc;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; min-height: 100vh; background: var(--page); color: var(--text);
    font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 22px 24px 40px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 13px; }
  .brand-icon {
    display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px;
    background: linear-gradient(150deg, var(--accent), var(--accent-2));
    box-shadow: 0 10px 22px -12px var(--accent);
  }
  .brand-name { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .mono-badge {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.02em; color: var(--accent);
    padding: 2px 7px; border-radius: 6px; background: var(--accent-soft); white-space: nowrap;
  }
  .chips { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .chip {
    display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 13px;
    border: 1px solid var(--stroke); border-radius: 9px; background: var(--surface);
    color: var(--text-2); font-size: 12.5px; white-space: nowrap;
  }
  .dot { width: 7px; height: 7px; border-radius: 999px; background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
  .dot.off { background: var(--danger); box-shadow: none; }
  .icon-btn {
    display: grid; place-items: center; width: 38px; height: 38px; border: 1px solid var(--stroke);
    border-radius: 12px; background: var(--surface-2); color: var(--text-2); cursor: pointer; padding: 0;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--stroke-strong); }
  .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tabs-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
  .seg { display: flex; gap: 3px; padding: 3px; border-radius: 12px; background: var(--surface-3); width: fit-content; }
  .seg-btn {
    height: 32px; padding: 0 13px; border: 0; border-radius: 9px; background: transparent;
    color: var(--text-2); font-weight: 500; font-size: 13px; white-space: nowrap; font-family: inherit; cursor: pointer;
  }
  .seg-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .seg-btn.on { background: var(--accent); color: #fff; font-weight: 600; box-shadow: 0 6px 14px -8px var(--accent); }
  .search-box {
    display: flex; align-items: center; gap: 9px; height: 38px; padding: 0 12px; width: 260px; max-width: 100%;
    border: 1px solid var(--stroke); border-radius: 11px; background: var(--surface-2);
  }
  .search-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .search-box svg { color: var(--text-3); flex: none; }
  .search-box input { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 13.5px; color: var(--text); outline: none; }
  .search-box input::placeholder { color: var(--text-3); }
  main { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 18px; }
  .stat-card {
    display: flex; flex-direction: column; gap: 14px; padding: 20px 22px; border-radius: 15px;
    background: var(--card); border: 1px solid var(--stroke); box-shadow: var(--sh);
    backdrop-filter: blur(14px); min-width: 0;
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .label {
    font-size: 11px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--text-3);
  }
  .hero-row { display: flex; align-items: baseline; gap: 6px; }
  .hero { font-size: 36px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums; }
  .hero-unit { font-size: 17px; font-weight: 600; color: var(--text-3); }
  .hero-side { margin-left: auto; font-size: 12.5px; color: var(--text-2); }
  .hero-side b { font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
  .sub { font-size: 12px; color: var(--text-3); }
  .bar-track { height: 8px; border-radius: 999px; background: var(--surface-3); overflow: hidden; position: relative; }
  .bar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width 0.4s ease; }
  .bar-cap { position: absolute; top: -2px; width: 2px; height: 12px; border-radius: 2px; background: var(--text-3); }
  .row-between { display: flex; justify-content: space-between; }
  .status-ok { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ok); }
  .status-ok .mini-dot { width: 6px; height: 6px; border-radius: 999px; background: var(--ok); }
  .status-hot { color: var(--danger); }
  .status-hot .mini-dot { background: var(--danger); }
  .system-card {
    grid-column: 1 / -1; flex-direction: row; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 18px; padding: 18px 24px;
  }
  .kv { display: flex; flex-direction: column; gap: 5px; }
  .kv .v { font-size: 13.5px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
  .kv .v.mono { font-family: var(--mono); font-weight: 500; font-size: 12.5px; }
  .spark { display: block; width: 100%; height: 56px; }
  .net-heroes { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .net-item { display: flex; align-items: baseline; gap: 5px; }
  #view-processes { margin-top: 18px; }
  .proc-card {
    border-radius: 15px; background: var(--card); border: 1px solid var(--stroke);
    box-shadow: var(--sh); backdrop-filter: blur(14px); overflow: hidden;
  }
  .proc-grid { display: grid; grid-template-columns: minmax(0, 1fr) 120px 140px 100px 90px; gap: 14px; align-items: center; padding: 13px 22px; }
  .proc-grid.head { padding: 10px 22px; border-bottom: 1px solid var(--stroke); }
  .sort-btn {
    display: flex; align-items: center; gap: 5px; border: 0; background: transparent; padding: 4px 0;
    font-family: inherit; cursor: pointer; text-align: left;
    font-size: 11px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--text-3);
  }
  .sort-btn:hover { color: var(--text-2); }
  .sort-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sort-btn.on { color: var(--accent); }
  .sort-btn .arrow { font-size: 10px; line-height: 1; }
  .proc-row { border-top: 1px solid var(--stroke); }
  .proc-row.expandable { cursor: pointer; }
  .proc-row.expandable:hover { background: var(--surface); }
  .proc-id { display: flex; align-items: center; gap: 13px; min-width: 0; }
  .proc-icon { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 11px; flex: none; }
  .proc-names { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .proc-title { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .proc-title .n { font-weight: 600; }
  .proc-title .t { font-size: 12px; color: var(--text-3); }
  .procs-badge {
    font-size: 10.5px; font-weight: 600; color: var(--text-2); padding: 1px 7px;
    border-radius: 999px; background: var(--surface-3); white-space: nowrap;
  }
  .chev { transition: transform 0.15s ease; color: var(--text-3); flex: none; }
  .proc-row.open .chev { transform: rotate(90deg); }
  .proc-cmd { font-family: var(--mono); font-size: 11.5px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cell-num { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13.5px; }
  .cell-dim { font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .cpu-cell { display: flex; align-items: center; gap: 10px; }
  .mini-track { width: 56px; height: 5px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
  .mini-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
  .child-rows { border-top: 1px solid var(--stroke); background: var(--surface); }
  .child-row { grid-template-columns: minmax(0, 1fr) 120px 140px 100px 90px; padding: 8px 22px 8px 71px; }
  .child-row .n { font-size: 13px; font-weight: 500; color: var(--text-2); }
  .child-row .pid { font-family: var(--mono); font-size: 10.5px; color: var(--text-3); }
  .proc-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 22px; border-top: 1px solid var(--stroke); font-size: 12px; color: var(--text-3); flex-wrap: wrap; }
  @media (max-width: 900px) {
    main { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .proc-grid, .child-row { grid-template-columns: minmax(0, 1fr) 110px 90px; }
    .col-time, .col-disk { display: none !important; }
    .proc-cmd { display: none; }
  }
  @media (max-width: 620px) {
    main { grid-template-columns: minmax(0, 1fr); }
    .hero { font-size: 30px; }
    .system-card { flex-direction: column; align-items: flex-start; gap: 14px; }
    /* process rows become two lines: identity on top, metrics below */
    .proc-grid, .child-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 16px; }
    .proc-id { flex: 1 1 100%; }
    .col-mem { margin-left: auto; }
    .proc-grid.head { row-gap: 2px; }
    .proc-grid.head .sort-btn[data-sort="name"] { flex: 1 1 100%; }
    .child-row { padding-left: 24px; }
  }
  #view-projects, #view-project-detail { margin-top: 18px; }
  .proj-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .proj-card {
    display: flex; flex-direction: column; gap: 14px; padding: 20px 22px; border-radius: 15px;
    background: var(--card); border: 1px solid var(--stroke); box-shadow: var(--sh);
    backdrop-filter: blur(14px); cursor: pointer; min-width: 0;
    transition: transform 0.16s cubic-bezier(0.2, 0.8, 0.25, 1), border-color 0.16s;
  }
  .proj-card:hover { transform: translateY(-2px); border-color: var(--stroke-strong); }
  .proj-icon { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; flex: none; font-weight: 700; font-size: 16px; background: var(--accent-soft); color: var(--accent); }
  .src-badge { font-size: 10.5px; font-weight: 600; color: var(--text-2); padding: 1px 7px; border-radius: 999px; background: var(--surface-3); white-space: nowrap; }
  .proj-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .proj-stats .v { font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .deploy-line { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-2); padding-top: 12px; border-top: 1px solid var(--stroke); flex-wrap: wrap; }
  .detail-tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  .tile { display: flex; flex-direction: column; gap: 8px; padding: 18px 20px; border-radius: 15px; background: var(--card); border: 1px solid var(--stroke); box-shadow: var(--sh); backdrop-filter: blur(14px); min-width: 0; }
  .tile .big { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums; }
  .tile .unit { font-size: 15px; font-weight: 600; color: var(--text-3); }
  .detail-cols { display: grid; grid-template-columns: 1.25fr 1fr; gap: 16px; margin-top: 16px; }
  .dcard { display: flex; flex-direction: column; border-radius: 15px; background: var(--card); border: 1px solid var(--stroke); box-shadow: var(--sh); backdrop-filter: blur(14px); overflow: hidden; }
  .dcard-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--stroke); }
  .drow { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-top: 1px solid var(--stroke); }
  .drow:first-of-type { border-top: 0; }
  .back-btn { display: grid; place-items: center; width: 34px; height: 34px; border: 0; background: transparent; color: var(--text-3); cursor: pointer; border-radius: 10px; padding: 0; }
  .back-btn:hover { color: var(--text); background: var(--surface-2); }
  .mini-dot2 { width: 7px; height: 7px; border-radius: 999px; flex: none; }
  .repo-chip { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 13px; border: 1px solid var(--stroke); border-radius: 11px; background: var(--surface-2); font-size: 12.5px; color: var(--text-2); }
  .empty-note { padding: 22px 20px; font-size: 13px; color: var(--text-3); text-align: center; }
  @media (max-width: 900px) { .proj-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .detail-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .detail-cols { grid-template-columns: minmax(0, 1fr); } .wiz-cols { grid-template-columns: minmax(0, 1fr) !important; } }
  @media (max-width: 620px) { .proj-grid { grid-template-columns: minmax(0, 1fr); } .detail-tiles { grid-template-columns: minmax(0, 1fr); } }
  #view-wizard { margin-top: 18px; }
  .step-chip { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px; border-radius: 999px; font-size: 12.5px; font-weight: 600; border: 1px solid var(--stroke); background: var(--surface); color: var(--text-3); white-space: nowrap; }
  .step-chip.on { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
  .step-chip.done { color: var(--ok); border-color: transparent; background: var(--ok-soft); }
  .step-num { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 999px; background: var(--surface-3); font-size: 11px; font-weight: 700; }
  .step-chip.on .step-num { background: var(--accent); color: #fff; }
  .wrow { display: flex; align-items: center; gap: 13px; padding: 13px 20px; border-top: 1px solid var(--stroke); }
  .wrow:first-of-type { border-top: 0; }
  .wrow.pick { cursor: pointer; }
  .wrow.pick:hover { background: var(--surface); }
  .wrow.sel { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  .wrow.dim { opacity: 0.45; cursor: default; }
  .lang-dot { width: 9px; height: 9px; border-radius: 999px; flex: none; background: var(--text-3); }
  .pill { font-size: 10.5px; font-weight: 600; color: var(--text-2); padding: 1px 7px; border-radius: 999px; background: var(--surface-3); white-space: nowrap; }
  .btn-primary { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border: 0; border-radius: 12px; background: linear-gradient(150deg, var(--accent), var(--accent-2)); color: #fff; font-weight: 600; font-size: 13.5px; white-space: nowrap; font-family: inherit; cursor: pointer; box-shadow: 0 10px 22px -12px var(--accent); }
  .btn-primary:disabled { opacity: 0.4; box-shadow: none; cursor: default; }
  .btn-ghost { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border: 1px solid var(--stroke); border-radius: 12px; background: var(--surface-2); color: var(--text-2); font-weight: 600; font-size: 13.5px; font-family: inherit; cursor: pointer; }
  .file-add { font-family: var(--mono); font-size: 10.5px; color: var(--ok); padding: 1px 7px; border-radius: 6px; background: var(--ok-soft); white-space: nowrap; }
  .warn-strip { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(234, 179, 8, 0.35); background: rgba(234, 179, 8, 0.09); font-size: 12.5px; color: var(--text-2); }
  .prog-icon { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 999px; flex: none; }
  .spin { border: 2.5px solid var(--accent-soft); border-top-color: var(--accent); border-radius: 999px; width: 16px; height: 16px; animation: wspin 0.9s linear infinite; }
  @keyframes wspin { to { transform: rotate(360deg); } }
  footer { margin-top: 26px; text-align: center; font-size: 12px; color: var(--text-3); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="brand-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="8" rx="2"></rect><rect x="3" y="14" width="18" height="6" rx="2"></rect><circle cx="7" cy="8" r="0.6" fill="#fff"></circle><circle cx="7" cy="17" r="0.6" fill="#fff"></circle></svg>
      </div>
      <div style="display:flex;align-items:baseline;gap:10px">
        <span class="brand-name">webo</span>
        <span class="mono-badge" id="hostname">—</span>
      </div>
    </div>
    <div class="chips">
      <div class="chip"><span class="dot" id="live-dot"></span><span id="uptime">…</span></div>
      <button class="icon-btn" id="theme-btn" aria-label="Toggle theme">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
      </button>
    </div>
  </header>

  <div class="tabs-row">
    <div class="seg" role="tablist">
      <button class="seg-btn on" id="tab-overview" role="tab" data-i18n="tabOverview">Overview</button>
      <button class="seg-btn" id="tab-processes" role="tab" data-i18n="tabProcesses">Processes</button>
      <button class="seg-btn" id="tab-projects" role="tab" data-i18n="tabProjects">Projects</button>
    </div>
    <div class="search-box" id="proc-search-box" hidden>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20 L16.5 16.5"></path></svg>
      <input id="proc-search" type="search" autocomplete="off">
    </div>
  </div>

  <main id="view-overview">
    <section class="stat-card">
      <div class="card-head"><span class="label" data-i18n="cpu">CPU</span><span class="mono-badge" id="cpu-brand">—</span></div>
      <div class="hero-row">
        <span class="hero" id="cpu-pct">—</span><span class="hero-unit">%</span>
        <span class="hero-side">load <b id="load">—</b></span>
      </div>
      <svg class="spark" id="spark-cpu" viewBox="0 0 340 56" preserveAspectRatio="none"></svg>
      <span class="sub" id="cpu-sub"></span>
    </section>

    <section class="stat-card">

  const LANG = (navigator.language || "en").toLowerCase().startsWith("pt") ? "pt" : "en";
  const LOCALE = LANG === "pt" ? "pt-BR" : "en-US";
  const t = (k, ...a) => {
    const v = STR[LANG][k] ?? STR.en[k];
    return typeof v === "function" ? v(...a) : v ?? k;
  };
  document.documentElement.lang = LANG === "pt" ? "pt-BR" : "en";
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.getElementById("proc-search").placeholder = t("searchPh");

  // ---------- theme: explicit choice > system preference ----------
  const root = document.documentElement;
  const applyTheme = (th) => { if (th === "light") root.dataset.theme = "light"; else delete root.dataset.theme; };
  let theme = null;
  try { theme = localStorage.getItem("webo-theme"); } catch {}
  if (!theme) theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  applyTheme(theme);
  document.getElementById("theme-btn").addEventListener("click", () => {
    theme = theme === "light" ? "dark" : "light";
    applyTheme(theme);
    try { localStorage.setItem("webo-theme", theme); } catch {}
  });

  // ---------- helpers ----------
  const $ = (id) => document.getElementById(id);
  const GB = 1024 ** 3;
  const fmt1 = (n) => n.toLocaleString(LOCALE, { maximumFractionDigits: 1 });
  const fmt0 = (n) => Math.round(n).toLocaleString(LOCALE);

  function bytesUnit(bytes) {
    if (bytes >= 100 * GB) return [bytes / GB, "GB", fmt0];
    if (bytes >= GB) return [bytes / GB, "GB", fmt1];
    return [bytes / 1024 ** 2, "MB", fmt0];
  }
  function rateUnit(bps) {
    if (bps >= 1024 ** 2) return [bps / 1024 ** 2, "MB/s", fmt1];
    if (bps >= 1024) return [bps / 1024, "KB/s", fmt0];
    return [bps, "B/s", fmt0];
  }
  function fmtUptime(secs) {
    const d = Math.floor(secs / 86400), h = Math.floor((secs % 86400) / 3600), m = Math.floor((secs % 3600) / 60);
    if (d > 0) return t("upFor", t("dh", d, h));
    if (h > 0) return t("upFor", t("hm", h, m));
    return t("upFor", t("onlyM", m));
  }
  function fmtRun(secs) {
    const d = Math.floor(secs / 86400), h = Math.floor((secs % 86400) / 3600), m = Math.floor((secs % 3600) / 60);
    if (d > 0) return d === 1 ? t("dayOne") : t("days", d);
    if (h > 0) return h === 1 ? t("hourOne") : t("hours", h);
    if (m > 0) return t("mins", m);
    return t("now");
  }
  function fmtMem(b) { return b >= GB ? `${fmt1(b / GB)} GB` : `${fmt0(b / 1024 ** 2)} MB`; }
  function fmtDisk(bps) {
    if (bps < 1024) return "—";
    const [v, u, f] = rateUnit(bps);
    return `${f(v)} ${u}`;
  }
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");

  // ---------- sparklines ----------
  function sparkline(svgId, values, max) {
    const svg = $(svgId);
    if (!values.length) { svg.replaceChildren(); return; }
    const W = 340, H = 56, PAD = 6;
    const top = max ?? Math.max(...values, 1e-9);
    const pts = values.map((v, i) => {
      const x = values.length === 1 ? W : (i / (values.length - 1)) * W;
      const y = H - PAD - Math.min(v / top, 1) * (H - 2 * PAD);
      return [x, y];
    });
    const line = pts.map(([x, y], i) => `${i ? "L" : "M"}${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
    const [lx, ly] = pts[pts.length - 1];
    svg.innerHTML =
      `<line x1="0" y1="${H / 2}" x2="${W}" y2="${H / 2}" stroke="rgba(140,165,215,0.12)" stroke-width="1"></line>` +
      `<path d="${line} L${W},${H} L0,${H} Z" fill="rgba(79,139,255,0.16)" stroke="none"></path>` +
      `<path d="${line}" fill="none" stroke="#4f8bff" stroke-width="2" stroke-linecap="round"></path>` +
      `<circle cx="${lx}" cy="${ly}" r="3.5" fill="#4f8bff" stroke="var(--spark-ring)" stroke-width="2"></circle>`;
  }
  function decimate(values, target = 120) {
    if (values.length <= target) return values;
    const size = values.length / target;
    const out = [];
    for (let i = 0; i < target; i++) {
      const a = Math.floor(i * size), b = Math.max(a + 1, Math.floor((i + 1) * size));
      let sum = 0;
      for (let j = a; j < b; j++) sum += values[j];
      out.push(sum / (b - a));
    }
    return out;
  }

  // ---------- overview ----------
  async function loadSystem() {
    const s = await (await fetch("/api/v1/system")).json();
    $("hostname").textContent = s.hostname || "?";
    $("cpu-brand").textContent = `${shortCpu(s.cpu_brand)} · ${s.cpu_threads} threads`;

    $("disk-total").textContent = `${fmt0(s.disk_total / GB)} GB`;
    $("sys-os").textContent = s.os || "—";
    $("sys-kernel").textContent = s.kernel || "—";
    $("sys-arch").textContent = s.arch || "—";
    $("sys-sample").textContent = t("sampleEvery", s.sample_secs);
    $("sys-version").textContent = `v${s.webo_version}`;
  }
  function shortCpu(brand) {
    return (brand || "").replace(/\(R\)|\(TM\)|CPU|Processor|@.*$/g, "").replace(/\s+/g, " ").trim() || "—";

  function renderSnapshot(s) {

    $("load").textContent = s.load_1m.toLocaleString(LOCALE, { maximumFractionDigits: 2 });

    $("mem-used").textContent = mf(mv); $("mem-unit").textContent = mu;
    $("mem-pct").textContent = `${fmt0((s.mem_used / s.mem_total) * 100)}%`;
    const [dv, du, df] = bytesUnit(s.disk_used);
    $("disk-used").textContent = df(dv); $("disk-unit").textContent = du;
    const dpct = (s.disk_used / s.disk_total) * 100;
    $("disk-pct").textContent = `${fmt0(dpct)}%`;
    $("disk-bar").style.width = `${Math.min(dpct, 100)}%`;
    $("disk-free").textContent = t("freeGb", fmt0((s.disk_total - s.disk_used) / GB));

    if (s.temp_c != null) {
      $("temp").textContent = fmt0(s.temp_c);
      $("temp-bar").style.width = `${Math.min(s.temp_c, 100)}%`;
      const hot = s.temp_c >= 85;
      $("temp-status").classList.toggle("status-hot", hot);
      $("temp-status-txt").textContent = hot ? t("hot") : t("normal");
    } else {
      $("temp-card").hidden = true;
    }

    if (s.battery_pct != null) {
      $("battery").textContent = s.battery_pct;
      $("battery-bar").style.width = `${s.battery_pct}%`;
      $("battery-status").textContent =
        s.battery_status === "Charging" ? t("charging") :
        s.battery_status === "Discharging" ? t("onBattery") : t("onAc");

      $("battery-card").hidden = true;
    }

    $("net-rx").textContent = rf(rv); $("net-rx-unit").textContent = ru;
    const [tv, tu, tf] = rateUnit(s.net_tx_bps);

  // ---------- processes: icons, sorting, groups ----------

  function hexSoft(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
  }

  function techAvatar(tech, name, size, iconSize) {
    const k = tech && KINDS[tech];
    if (k) {
      return `<div class="proj-icon" style="width:${size}px;height:${size}px;background:${hexSoft(k.color, 0.14)}" title="${esc(STR[LANG].kinds[tech] ?? tech)}">
        <svg width="${iconSize}" height="${iconSize}" viewBox="0 0 24 24" fill="none" stroke="${k.color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${k.icon}</svg>
      </div>`;
    }
    return `<div class="proj-icon" style="width:${size}px;height:${size}px;font-size:${size < 42 ? 16 : 17}px">${esc((name[0] || "?").toLowerCase())}</div>`;
  }

  let procData = { total: null, processes: [] };
  let sortKey = "cpu";
  let sortDir = -1; // -1 desc, 1 asc
  const expanded = new Set();
  const SORT_VAL = {
    name: (p) => p.name.toLowerCase(),
    uptime: (p) => p.uptime_secs,
    cpu: (p) => p.cpu_pct,
    mem: (p) => p.mem_bytes,
    disk: (p) => p.disk_bps,
  };

  function renderSortHeads() {
    document.querySelectorAll(".sort-btn").forEach((b) => {
      const on = b.dataset.sort === sortKey;
      b.classList.toggle("on", on);
      const arrow = on ? ` ${sortDir === -1 ? "↓" : "↑"}` : "";
      const base = b.dataset.sort === "name"
        ? (procData.total != null ? t("procHead", fmt0(procData.total)) : t("procHeadPlain"))
        : b.dataset.sort === "cpu" ? "CPU" : t(b.dataset.i18nCol);
      b.textContent = base + arrow;
    });
  }

  function childRow(c) {
    return `<div class="proc-grid child-row">
      <div class="proc-id" style="gap:9px"><span class="n">${esc(c.name)}</span><span class="pid">pid ${c.pid}</span></div>
      <span class="cell-dim col-time">${fmtRun(c.uptime_secs)}</span>
      <span class="cell-dim">${c.cpu_pct.toLocaleString(LOCALE, { minimumFractionDigits: 1, maximumFractionDigits: 1 })}%</span>
      <span class="cell-dim col-mem">${fmtMem(c.mem_bytes)}</span>
      <span class="cell-dim col-disk">${fmtDisk(c.disk_bps)}</span>
    </div>`;
  }

  function renderProcesses() {
    const q = $("proc-search").value.trim().toLowerCase();
    const all = procData.processes;
    const shown = q ? all.filter((p) => (p.name + " " + p.cmd).toLowerCase().includes(q)) : all.slice();
    const val = SORT_VAL[sortKey];
    shown.sort((a, b) => {
      const va = val(a), vb = val(b);
      return (va < vb ? -1 : va > vb ? 1 : 0) * sortDir;
    });
    const maxCpu = Math.max(...shown.map((p) => p.cpu_pct), 0.1);
    $("proc-rows").innerHTML = shown.map((p) => {
      const k = KINDS[p.kind] || KINDS.generic;
      const kindLabel = STR[LANG].kinds[p.kind] ?? "";
      const sub = kindLabel ? `<span class="t">${esc(kindLabel)}</span>` : "";
      const multi = p.procs > 1;
      const isOpen = expanded.has(p.pid);
      const badge = multi ? `<span class="procs-badge">${t("procsBadge", p.procs)}</span>` : "";
      const chev = multi ? `<svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5 L16 12 L9 19"></path></svg>` : "";
      const children = multi && isOpen ? `<div class="child-rows">${p.children.map(childRow).join("")}</div>` : "";
      return `<div>
        <div class="proc-grid proc-row ${multi ? "expandable" : ""} ${isOpen ? "open" : ""}" ${multi ? `data-pid="${p.pid}" role="button" tabindex="0"` : ""}>
          <div class="proc-id">
            ${chev}
            <div class="proc-icon" style="background:${hexSoft(k.color, p.kind === "generic" ? 0.1 : 0.14)}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${k.color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${k.icon}</svg>
            </div>
            <div class="proc-names">
              <div class="proc-title"><span class="n">${esc(p.name)}</span>${sub}${badge}</div>
              <span class="proc-cmd">${esc(p.cmd || "")}</span>
            </div>
          </div>
          <span class="cell-dim col-time">${fmtRun(p.uptime_secs)}</span>
          <div class="cpu-cell">
            <span class="cell-num">${p.cpu_pct.toLocaleString(LOCALE, { minimumFractionDigits: 1, maximumFractionDigits: 1 })}%</span>
            <div class="mini-track"><div class="mini-fill" style="width:${Math.min((p.cpu_pct / maxCpu) * 100, 100)}%"></div></div>
          </div>
          <span class="cell-num col-mem">${fmtMem(p.mem_bytes)}</span>
          <span class="cell-dim col-disk">${fmtDisk(p.disk_bps)}</span>
        </div>
        ${children}
      </div>`;
    }).join("");
    renderSortHeads();
    $("proc-foot-txt").textContent = q
      ? t("footSearch", shown.length, all.length, q)
      : procData.total != null && procData.total > all.length
        ? t("footShowing", all.length)
        : t("footShowingAll", all.length);
  }

  function toggleRow(target) {
    const row = target.closest(".proc-row.expandable");
    if (!row) return false;
    const pid = Number(row.dataset.pid);
    if (expanded.has(pid)) expanded.delete(pid); else expanded.add(pid);
    renderProcesses();
    return true;
  }
  $("proc-rows").addEventListener("click", (ev) => { toggleRow(ev.target); });
  $("proc-rows").addEventListener("keydown", (ev) => {
    if (ev.key !== "Enter" && ev.key !== " ") return;
    if (toggleRow(ev.target)) ev.preventDefault();
  });
  document.querySelectorAll(".sort-btn").forEach((b) => {
    b.addEventListener("click", () => {
      const key = b.dataset.sort;
      if (sortKey === key) sortDir = -sortDir;
      else { sortKey = key; sortDir = key === "name" ? 1 : -1; }
      renderProcesses();
    });
  });

  async function tickProcesses() {
    if ($("view-processes").hidden) return;

      procData = await (await fetch("/api/v1/processes")).json();
      renderProcesses();

  }
  $("proc-search").addEventListener("input", renderProcesses);

  // ---------- projects ----------
  const relTime = (secs) => {
    const d = Math.floor(secs / 86400), h = Math.floor((secs % 86400) / 3600), m = Math.floor((secs % 3600) / 60);
    if (d > 0) return d === 1 ? t("dayOne") : t("days", d);
    if (h > 0) return h === 1 ? t("hourOne") : t("hours", h);
    if (m > 0) return t("mins", m);
    return t("now");
  };
  const nowSecs = () => Math.floor(Date.now() / 1000);
  let currentProject = null;

  function sparkSvgInner(values, max, W, H) {
    if (!values.length) return "";
    const PAD = 5;
    const top = max ?? Math.max(...values, 1e-9);
    const pts = values.map((v, i) => {
      const x = values.length === 1 ? W : (i / (values.length - 1)) * W;
      const y = H - PAD - Math.min(v / top, 1) * (H - 2 * PAD);
      return [x, y];
    });
    const line = pts.map(([x, y], i) => `${i ? "L" : "M"}${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
    const [lx, ly] = pts[pts.length - 1];
    return `<line x1="0" y1="${H / 2}" x2="${W}" y2="${H / 2}" stroke="rgba(140,165,215,0.12)" stroke-width="1"></line>` +
      `<path d="${line} L${W},${H} L0,${H} Z" fill="rgba(79,139,255,0.16)"></path>` +
      `<path d="${line}" fill="none" stroke="#4f8bff" stroke-width="2" stroke-linecap="round"></path>` +
      `<circle cx="${lx}" cy="${ly}" r="3" fill="#4f8bff" stroke="var(--spark-ring)" stroke-width="2"></circle>`;
  }

  function renderProjectList(data) {
    const list = data.projects || [];

  function cpuMood(pct) {
    if (pct < 1) return t("cpuIdle");
    if (pct < 20) return t("cpuCruise");
    return t("cpuBusy");
  }

  function renderProjectDetail(d) {
    const hist = d.history || [];
    const cpuSeries = decimate(hist.map((x) => x.cpu_pct));
    const memSeries = decimate(hist.map((x) => x.mem_bytes));
    const memTotal = machineMem || Math.max(...hist.map((x) => x.mem_bytes), 1) * 1.4;
    const total = (d.image_bytes || 0) + (d.volume_bytes || 0);
    const repo = d.repo_owner && d.repo_name ? `${d.repo_owner}/${d.repo_name}` : null;
    const containers = (d.containers || []).map((c) => `
      <div class="drow">
        <span class="mini-dot2" style="background:${c.state === "running" ? "var(--ok)" : "var(--danger)"}"></span>
        <div style="display:flex;flex-direction:column;gap:2px;min-width:0;flex:1">

          <div style="display:flex;flex-direction:column;gap:2px;align-items:flex-end"><span class="cell-num">${c.cpu_pct.toLocaleString(LOCALE, { maximumFractionDigits: 1 })}%</span><span class="sub">CPU</span></div>

        </div>
      </div>`).join("");
    const builds = (d.builds || []).map((b) => {
      const ok = b.conclusion === "success";
      const running = b.status !== "completed";
      const failNote = !ok && !running ? ` · ${t("failedAt")}` : "";
      return `<div class="drow">
        <span class="mini-dot2" style="background:${running ? "var(--accent)" : ok ? "var(--ok)" : "var(--danger)"}"></span>
        <div style="display:flex;flex-direction:column;gap:2px;min-width:0;flex:1">
          <span style="font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.commit_msg)}</span>

    const versions = (d.versions || []).map((v) => `
      <div class="drow">
        <div style="display:flex;flex-direction:column;gap:2px;flex:1">

        </div>
        ${v.current
          ? `<span class="mono-badge" style="color:var(--ok);background:var(--ok-soft)">${t("onAir")}</span>`
          : `<span class="sub" style="color:var(--text-3)" title="${t("rollbackSoon")}">${t("rollbackSoon")}</span>`}
      </div>`).join("") || `<div class="empty-note">${t("noVersions")}</div>`;

    $("proj-back").addEventListener("click", () => {

  // ---------- new-project wizard ----------

  function wizHeader() {

          const right = r.already_project
            ? `<span class="pill">${t("wizAlready")}</span>`

          return `<div class="${cls}" data-repo="${esc(key)}" ${r.already_project ? "" : 'role="button" tabindex="0"'}>

                ${r.private ? `<span class="pill">${t("wizPrivate")}</span>` : ""}
              </div>
              <span style="font-size:11.5px;color:var(--text-3)">${esc(r.language || "—")}</span>
            </div>

          </div>`;
        }).join("") || `<div class="empty-note">—</div>`;
    const selName = wiz.sel ? wiz.sel.split("/")[1] : null;
    $("view-wizard").innerHTML = wizHeader() + `
      <div style="display:flex;flex-direction:column;gap:16px;max-width:840px;margin:0 auto">
        <div class="search-box" style="width:100%">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20 L16.5 16.5"></path></svg>
          <input id="wiz-search" type="search" autocomplete="off" placeholder="${t("wizSearchPh")}" value="${esc(wiz.q || "")}">
        </div>
        <div class="dcard">
          <div class="dcard-title"><span class="label">${t("wizRepos")}</span><span class="sub">${t("wizViaToken")}</span></div>
          <div id="wiz-repo-rows">${rows}</div>
        </div>
        <div style="display:flex;justify-content:flex-end">
          <button class="btn-primary" id="wiz-continue" ${wiz.sel ? "" : "disabled"}>
            ${selName ? t("wizContinue", esc(selName)) : t("wizPick")}
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5 L16 12 L9 19"></path></svg>
          </button>

    wireWizCommon();
    const search = $("wiz-search");
    search.addEventListener("input", () => { wiz.q = search.value; renderWizStep1(); $("wiz-search").focus(); const v = $("wiz-search").value; $("wiz-search").setSelectionRange(v.length, v.length); });
    $("wiz-repo-rows").addEventListener("click", (ev) => {

    $("wiz-continue").addEventListener("click", async () => {
      if (!wiz.sel) return;
      const [owner, name] = wiz.sel.split("/");
      $("wiz-continue").disabled = true;
      try {
        const res = await fetch("/api/v1/projects", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ repo_owner: owner, repo_name: name }),
        });
        const data = await res.json();
        if (!res.ok) { wiz.error = t("wizError", data.error || res.status); renderWizStep1(); return; }
        wiz.step = 2; wiz.plan = data; wiz.error = null;
        renderWizStep2();
      } catch { wiz.error = t("wizError", "network"); renderWizStep1(); }
    });
  }

    const evidence = p.template === "rails" ? t("wizGemfile", "rails") : t("wizPackage");

    $("view-wizard").innerHTML = wizHeader() + `
      <div style="display:grid;grid-template-columns:1fr 1.2fr;gap:16px;max-width:1100px;margin:0 auto" class="wiz-cols">

              <div class="proj-icon" style="width:46px;height:46px;background:${hexSoft(kind.color, 0.14)}">
                <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="${kind.color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${kind.icon}</svg>
              </div>
              <div style="display:flex;flex-direction:column;gap:3px">
                <div style="display:flex;align-items:center;gap:9px">
                  <span style="font-size:17px;font-weight:700">${t("wizDetected", techLabel())}</span>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ok)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5 L9.5 17.5 L19.5 6.5"></path></svg>
                </div>
                <span style="font-family:var(--mono);font-size:12px;color:var(--text-3)">${esc(repoFull)} · ${esc(p.branch)}</span>
              </div>
            </div>
            <div style="display:flex;flex-direction:column;gap:9px;font-size:12.5px;color:var(--text-2)">

            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 L12 5 L19 12"></path><path d="M12 5 L12 19"></path></svg>
            ${t("wizCreate")}
          </button>
          ${wiz.error ? `<div class="warn-strip">${esc(wiz.error)}</div>` : ""}

        const data = await res.json();
        if (!res.ok) { wiz.error = t("wizError", data.error || res.status); renderWizStep2(); return; }
        wiz.step = 3; wiz.provision = data; wiz.slug = p.slug; wiz.error = null;

      ? `<div class="prog-icon" style="background:var(--ok-soft)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--ok)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5 L9.5 17.5 L19.5 6.5"></path></svg></div>`
      : state === "fail"
        ? `<div class="prog-icon" style="background:rgba(229,72,77,0.14)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2.6" stroke-linecap="round"><path d="M6 6 L18 18 M18 6 L6 18"></path></svg></div>`
        : state === "run"
          ? `<div class="prog-icon" style="background:var(--accent-soft)"><div class="spin"></div></div>`

      </div>

  async function pollFirstDeploy() {
    if (!wiz || !wiz.slug) { stopWizPoll(); return; }
    try {
      const d = await (await fetch(`/api/v1/projects/${encodeURIComponent(wiz.slug)}`)).json();
      renderWizStep3(d);
      if (d.running && d.builds && d.builds[0] && d.builds[0].status === "completed") stopWizPoll();
    } catch {}
  }

  function renderWizStep3(detail) {
    if (!wiz || wiz.step !== 3 || $("view-wizard").hidden) return;
    const prov = wiz.provision;
    const kind = wiz.plan.template === "rails" ? KINDS.ruby : KINDS.node;
    const build = detail && detail.builds && detail.builds[0];
    const buildState = !build ? "run" : build.status !== "completed" ? "run" : build.conclusion === "success" ? "done" : "fail";
    const buildSub = build
      ? `${esc(build.workflow || "Deploy")} · ${esc(build.commit_msg)} · ${build.duration_secs}s`
      : "…";
    const serverState = buildState === "done" ? "done" : buildState === "fail" ? "fail" : "wait";
    const upState = detail && detail.running ? "done" : serverState === "done" ? "run" : "wait";
    const allDone = upState === "done";
    const failed = buildState === "fail";
    const secretsAll = (prov.secrets || []).every((x) => x.status === "created");
    const secretsSub = (prov.secrets || []).map((x) => `${x.name}${x.status !== "created" ? " ✗" : ""}`).join(" · ");
    const repoUrl = `https://github.com/${wiz.sel}/actions`;
    $("view-wizard").innerHTML = wizHeader() + `
      <div style="display:grid;grid-template-columns:1.2fr 1fr;gap:16px;max-width:1100px;margin:0 auto" class="wiz-cols">
        <div style="display:flex;flex-direction:column;gap:16px">
          <div class="dcard" style="padding:20px 22px;flex-direction:row;align-items:center;gap:13px;overflow:visible">
            <div class="proj-icon" style="width:44px;height:44px;background:${hexSoft(kind.color, 0.14)}">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="${kind.color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${kind.icon}</svg>
            </div>
            <div style="display:flex;flex-direction:column;gap:3px;flex:1">
              <div style="display:flex;align-items:center;gap:9px">
                <span style="font-size:17px;font-weight:700">${esc(wiz.plan.slug)}</span>
                <span class="pill" style="color:${failed ? "var(--danger)" : "var(--accent)"};background:${failed ? "rgba(229,72,77,0.14)" : "var(--accent-soft)"}">${failed ? t("wizFailed") : t("wizFirstDeploy")}</span>
              </div>
              <span style="font-family:var(--mono);font-size:12px;color:var(--text-3)">${esc(wiz.sel)} · ${techLabel()}</span>
            </div>
          </div>
          <div class="dcard">
            <div class="dcard-title"><span class="label">${t("wizLive")}</span><span class="sub">${t("wizEvery")}</span></div>
            ${progRow("done", t("wizStepCommit"), `${t("filesN", (prov.files || []).length)} · ${esc((prov.commit_sha || "").slice(0, 7))}`)}
            ${progRow(secretsAll ? "done" : "fail", t("wizStepSecrets"), esc(secretsSub))}
            ${progRow(buildState, t("wizStepBuild"), buildSub)}
            ${progRow(serverState, t("wizStepServer"), "webo-deploy · pull + compose up")}
            ${progRow(upState, t("wizStepUp"), t("wizStepUpSub"))}
          </div>
          ${allDone ? `<button class="btn-primary" id="wiz-see-project" style="justify-content:center;height:46px;font-size:14px">${t("wizSeeProject")}</button>` : ""}
        </div>
        <div style="display:flex;flex-direction:column;gap:16px">
          <div class="dcard" style="padding:20px 22px;gap:12px;overflow:visible">
            <span class="label">${t("wizMeanwhile")}</span>
            <span style="font-size:13px;color:var(--text-2);line-height:1.55">${t("wizCanClose")}</span>
            <a class="btn-ghost" style="width:fit-content;text-decoration:none" href="${repoUrl}" target="_blank" rel="noopener">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M9 19c-4 1.5-4-2-6-2"></path></svg>
              ${t("wizSeeRun")}
            </a>
          </div>
        </div>
      </div>`;
    wireWizCommon();
    const see = $("wiz-see-project");
    if (see) see.addEventListener("click", () => closeWizard(true));
  }

  function wireWizCommon() {
    const back = $("wiz-back");
    if (back) back.addEventListener("click", () => {
      if (!wiz) return;
      if (wiz.step === 2) { wiz.step = 1; wiz.plan = null; wiz.error = null; renderWizStep1(); }
      else if (wiz.step === 3) { closeWizard(false); }
      else closeWizard(false);
    });
  }

  async function openWizard() {
    stopWizPoll();
    wiz = { step: 1, repos: null, q: "", sel: null };
    ["view-overview", "view-processes", "view-projects", "view-project-detail"].forEach((v) => { $(v).hidden = true; });
    $("view-wizard").hidden = false;
    renderWizStep1();
    try {
      const res = await fetch("/api/v1/github/repos");
      const data = await res.json();
      if (!res.ok) { wiz.error = t("wizError", data.error || res.status); }
      else wiz.repos = data.repos || [];
    } catch { wiz.error = t("wizError", "network"); }
    if (wiz && wiz.step === 1) renderWizStep1();
  }
  $("wiz-open").addEventListener("click", openWizard);

  // ---------- tabs ----------
  const tabs = [
    { btn: "tab-overview", views: ["view-overview"] },
    { btn: "tab-processes", views: ["view-processes"] },
    { btn: "tab-projects", views: ["view-projects", "view-project-detail"] },
  ];
  const allViews = ["view-overview", "view-processes", "view-projects", "view-project-detail", "view-wizard"];
  tabs.forEach(({ btn, views }) => {
    $(btn).addEventListener("click", () => {
      tabs.forEach((tb) => $(tb.btn).classList.toggle("on", tb.btn === btn));
      allViews.forEach((v) => { $(v).hidden = true; });
      stopWizPoll(); wiz = null;
      if (btn === "tab-projects" && currentProject) {
        $("view-project-detail").hidden = false;
      } else {
        $(views[0]).hidden = false;
        if (btn !== "tab-projects") currentProject = null;
      }
      $("proc-search-box").hidden = btn !== "tab-processes";
      if (btn === "tab-processes") tickProcesses();
      if (btn === "tab-projects") tickProjects();
    });
  });

  loadSystem().then(() => {}).catch(() => {});
  fetch("/api/v1/system").then((r) => r.json()).then((s) => { machineMem = s.mem_total || 0; }).catch(() => {});
  tick(); tickHistory(); tickProcesses(); tickProjects();
  setInterval(tick, 15000);
  setInterval(tickHistory, 60000);
  setInterval(tickProcesses, 15000);
  setInterval(tickProjects, 15000);
})();
</script>
</body>
</html>
