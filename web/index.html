<style>
  :root {

<div class="wrap">
  <header>
    <div class="brand">
      <div class="brand-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="8" rx="2"></rect><rect x="3" y="14" width="18" height="6" rx="2"></rect><circle cx="7" cy="8" r="0.6" fill="#fff"></circle><circle cx="7" cy="17" r="0.6" fill="#fff"></circle></svg>
      </div>
      <div style="display:flex;align-items:baseline;gap:10px">
        <span class="brand-name">webo</span>
        <span class="mono-badge" id="hostname">—</span>
      </div>
    </div>
    <div class="chips">
      <div class="chip"><span class="dot" id="live-dot"></span><span id="uptime">…</span></div>
      <button class="icon-btn" id="theme-btn" aria-label="Toggle theme">

      </button>
    </div>
  </header>

  <div class="tabs-row">
    <div class="seg" role="tablist">
      <button class="seg-btn on" id="tab-overview" role="tab" data-i18n="tabOverview">Overview</button>
      <button class="seg-btn" id="tab-processes" role="tab" data-i18n="tabProcesses">Processes</button>
      <button class="seg-btn" id="tab-projects" role="tab" data-i18n="tabProjects">Projects</button>
    </div>
    <div class="search-box" id="proc-search-box" hidden>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20 L16.5 16.5"></path></svg>
      <input id="proc-search" type="search" autocomplete="off">
    </div>
  </div>

  <main id="view-overview">
    <section class="stat-card">
      <div class="card-head"><span class="label" data-i18n="cpu">CPU</span><span class="mono-badge" id="cpu-brand">—</span></div>
      <div class="hero-row">
        <span class="hero" id="cpu-pct">—</span><span class="hero-unit">%</span>
        <span class="hero-side">load <b id="load">—</b></span>
      </div>
      <svg class="spark" id="spark-cpu" viewBox="0 0 340 56" preserveAspectRatio="none"></svg>
      <span class="sub" id="cpu-sub"></span>
    </section>

    <section class="stat-card">
      <div class="card-head"><span class="label" data-i18n="memory">Memory</span><span class="mono-badge" id="mem-total">—</span></div>
      <div class="hero-row">
        <span class="hero" id="mem-used">—</span><span class="hero-unit" id="mem-unit">GB</span>
        <span class="hero-side"><b id="mem-pct">—</b> <span data-i18n="inUse">in use</span></span>
      </div>
      <svg class="spark" id="spark-mem" viewBox="0 0 340 56" preserveAspectRatio="none"></svg>
      <span class="sub" data-i18n="last24h">last 24 h</span>
    </section>

    <section class="stat-card">
      <div class="card-head"><span class="label" data-i18n="disk">Disk</span><span class="mono-badge" id="disk-total">—</span></div>
      <div class="hero-row">
        <span class="hero" id="disk-used">—</span><span class="hero-unit" id="disk-unit">GB</span>
        <span class="hero-side"><b id="disk-pct">—</b> <span data-i18n="used">used</span></span>
      </div>
      <div style="display:flex;flex-direction:column;gap:9px;margin-top:12px">
        <div class="bar-track"><div class="bar-fill" id="disk-bar" style="width:0%"></div></div>
        <div class="row-between sub"><span id="disk-free">—</span><span data-i18n="rootFs">root filesystem</span></div>
      </div>
    </section>

    <section class="stat-card" id="temp-card">
      <div class="card-head"><span class="label" data-i18n="temperature">Temperature</span>
        <span class="status-ok" id="temp-status"><span class="mini-dot"></span><span id="temp-status-txt">—</span></span>
      </div>
      <div class="hero-row"><span class="hero" id="temp">—</span><span class="hero-unit">°C</span></div>
      <div style="display:flex;flex-direction:column;gap:9px">
        <div class="bar-track"><div class="bar-fill" id="temp-bar" style="width:0%"></div></div>
        <div class="row-between sub"><span data-i18n="cpu">CPU</span><span data-i18n="alertAt">alert at 85 °C</span></div>
      </div>
    </section>

    <section class="stat-card" id="battery-card">
      <div class="card-head"><span class="label" data-i18n="battery">Battery</span><span class="mono-badge" id="battery-limit" hidden>—</span></div>

        <span class="hero" id="battery">—</span><span class="hero-unit">%</span>
        <span class="hero-side" id="battery-status">—</span>
      </div>

        <div class="bar-track"><div class="bar-fill" id="battery-bar" style="width:0%"></div><div class="bar-cap" id="battery-cap" hidden></div></div>
        <div class="row-between sub"><span id="battery-note"></span></div>
      </div>
    </section>

    <section class="stat-card">
      <div class="card-head"><span class="label" data-i18n="network">Network</span></div>
      <div class="net-heroes">
        <div class="net-item">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="transform:translateY(1px)" aria-hidden="true"><path d="M12 4 L12 20"></path><path d="M6 14 L12 20 L18 14"></path></svg>
          <span class="hero" style="font-size:27px" id="net-rx">—</span><span class="hero-unit" style="font-size:14px" id="net-rx-unit">MB/s</span>
        </div>
        <div class="net-item">

          <span class="hero" style="font-size:27px;color:var(--text-2)" id="net-tx">—</span><span class="hero-unit" style="font-size:14px" id="net-tx-unit">MB/s</span>
        </div>
      </div>
      <svg class="spark" id="spark-net" viewBox="0 0 340 56" preserveAspectRatio="none"></svg>
      <span class="sub" data-i18n="download24h">download · last 24 h</span>
    </section>

    <section class="stat-card system-card">
      <div class="kv"><span class="label" data-i18n="system">System</span><span class="v" id="sys-os">—</span></div>
      <div class="kv"><span class="label" data-i18n="kernel">Kernel</span><span class="v mono" id="sys-kernel">—</span></div>
      <div class="kv"><span class="label" data-i18n="arch">Architecture</span><span class="v mono" id="sys-arch">—</span></div>
      <div class="kv"><span class="label" data-i18n="processesLbl">Processes</span><span class="v" id="sys-procs">—</span></div>
      <div class="kv"><span class="label" data-i18n="sampling">Sampling</span><span class="v" id="sys-sample">—</span></div>
      <div class="kv"><span class="label">Webo</span><span class="v mono" id="sys-version">—</span></div>
    </section>
  </main>

  <section id="view-processes" hidden>
    <div class="proc-card">
      <div class="proc-grid head">
        <button class="sort-btn" data-sort="name" id="proc-head"></button>
        <button class="sort-btn col-time" data-sort="uptime" data-i18n-col="colRunning">Running for</button>
        <button class="sort-btn on" data-sort="cpu">CPU</button>
        <button class="sort-btn" data-sort="mem" data-i18n-col="colMemory">Memory</button>
        <button class="sort-btn col-disk" data-sort="disk" data-i18n-col="colDisk">Disk</button>
      </div>
      <div id="proc-rows"></div>
      <div class="proc-foot"><span id="proc-foot-txt">…</span></div>
    </div>
  </section>

  <section id="view-projects" hidden>
    <div style="display:flex;justify-content:flex-end;margin-bottom:16px">
      <button class="btn-primary" id="wiz-open">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>

    </div>
    <div class="proj-grid" id="proj-cards"></div>
    <div class="empty-note" id="proj-empty" hidden></div>
  </section>

  <section id="view-project-detail" hidden></section>

  <section id="view-wizard" hidden></section>

  <footer data-i18n="footer">webo · self-hosted health panel</footer>
</div>

  const root = document.documentElement;
  const applyTheme = (th) => { if (th === "light") root.dataset.theme = "light"; else delete root.dataset.theme; };
  let theme = null;
  try { theme = localStorage.getItem("webo-theme"); } catch {}
  if (!theme) theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  applyTheme(theme);
  document.getElementById("theme-btn").addEventListener("click", () => {
    theme = theme === "light" ? "dark" : "light";
    applyTheme(theme);
    try { localStorage.setItem("webo-theme", theme); } catch {}

  // ---------- helpers ----------
  const $ = (id) => document.getElementById(id);
  const GB = 1024 ** 3;
  const fmt1 = (n) => n.toLocaleString(LOCALE, { maximumFractionDigits: 1 });
  const fmt0 = (n) => Math.round(n).toLocaleString(LOCALE);

  function bytesUnit(bytes) {
    if (bytes >= 100 * GB) return [bytes / GB, "GB", fmt0];
    if (bytes >= GB) return [bytes / GB, "GB", fmt1];
    return [bytes / 1024 ** 2, "MB", fmt0];
  }
  function rateUnit(bps) {
    if (bps >= 1024 ** 2) return [bps / 1024 ** 2, "MB/s", fmt1];
    if (bps >= 1024) return [bps / 1024, "KB/s", fmt0];
    return [bps, "B/s", fmt0];
  }
  function fmtUptime(secs) {
    const d = Math.floor(secs / 86400), h = Math.floor((secs % 86400) / 3600), m = Math.floor((secs % 3600) / 60);
    if (d > 0) return t("upFor", t("dh", d, h));
    if (h > 0) return t("upFor", t("hm", h, m));
    return t("upFor", t("onlyM", m));
  }
  function fmtRun(secs) {
    const d = Math.floor(secs / 86400), h = Math.floor((secs % 86400) / 3600), m = Math.floor((secs % 3600) / 60);
    if (d > 0) return d === 1 ? t("dayOne") : t("days", d);
    if (h > 0) return h === 1 ? t("hourOne") : t("hours", h);
    if (m > 0) return t("mins", m);
    return t("now");
  }
  function fmtMem(b) { return b >= GB ? `${fmt1(b / GB)} GB` : `${fmt0(b / 1024 ** 2)} MB`; }
  function fmtDisk(bps) {
    if (bps < 1024) return "—";
    const [v, u, f] = rateUnit(bps);
    return `${f(v)} ${u}`;
  }
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");

  // ---------- sparklines ----------
  function sparkline(svgId, values, max) {
    const svg = $(svgId);
    if (!values.length) { svg.replaceChildren(); return; }
    const W = 340, H = 56, PAD = 6;
    const top = max ?? Math.max(...values, 1e-9);
    const pts = values.map((v, i) => {
      const x = values.length === 1 ? W : (i / (values.length - 1)) * W;
      const y = H - PAD - Math.min(v / top, 1) * (H - 2 * PAD);
      return [x, y];
    });
    const line = pts.map(([x, y], i) => `${i ? "L" : "M"}${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
    const [lx, ly] = pts[pts.length - 1];
    svg.innerHTML =
      `<line x1="0" y1="${H / 2}" x2="${W}" y2="${H / 2}" stroke="rgba(140,165,215,0.12)" stroke-width="1"></line>` +
      `<path d="${line} L${W},${H} L0,${H} Z" fill="rgba(79,139,255,0.16)" stroke="none"></path>` +
      `<path d="${line}" fill="none" stroke="#4f8bff" stroke-width="2" stroke-linecap="round"></path>` +
      `<circle cx="${lx}" cy="${ly}" r="3.5" fill="#4f8bff" stroke="var(--spark-ring)" stroke-width="2"></circle>`;
  }
  function decimate(values, target = 120) {
    if (values.length <= target) return values;
    const size = values.length / target;
    const out = [];
    for (let i = 0; i < target; i++) {
      const a = Math.floor(i * size), b = Math.max(a + 1, Math.floor((i + 1) * size));
      let sum = 0;
      for (let j = a; j < b; j++) sum += values[j];
      out.push(sum / (b - a));
    }
    return out;
  }

  // ---------- overview ----------
  async function loadSystem() {
    const s = await (await fetch("/api/v1/system")).json();
    $("hostname").textContent = s.hostname || "?";
    $("cpu-brand").textContent = `${shortCpu(s.cpu_brand)} · ${s.cpu_threads} threads`;
    $("mem-total").textContent = `${fmt0(s.mem_total / GB)} GB`;
    $("disk-total").textContent = `${fmt0(s.disk_total / GB)} GB`;
    $("sys-os").textContent = s.os || "—";
    $("sys-kernel").textContent = s.kernel || "—";
    $("sys-arch").textContent = s.arch || "—";
    $("sys-sample").textContent = t("sampleEvery", s.sample_secs);
    $("sys-version").textContent = `v${s.webo_version}`;
  }
  function shortCpu(brand) {
    return (brand || "").replace(/\(R\)|\(TM\)|CPU|Processor|@.*$/g, "").replace(/\s+/g, " ").trim() || "—";
  }

  function renderSnapshot(s) {
    $("cpu-pct").textContent = fmt0(s.cpu_pct);
    $("load").textContent = s.load_1m.toLocaleString(LOCALE, { maximumFractionDigits: 2 });
    const [mv, mu, mf] = bytesUnit(s.mem_used);
    $("mem-used").textContent = mf(mv); $("mem-unit").textContent = mu;
    $("mem-pct").textContent = `${fmt0((s.mem_used / s.mem_total) * 100)}%`;
    const [dv, du, df] = bytesUnit(s.disk_used);
    $("disk-used").textContent = df(dv); $("disk-unit").textContent = du;
    const dpct = (s.disk_used / s.disk_total) * 100;
    $("disk-pct").textContent = `${fmt0(dpct)}%`;
    $("disk-bar").style.width = `${Math.min(dpct, 100)}%`;
    $("disk-free").textContent = t("freeGb", fmt0((s.disk_total - s.disk_used) / GB));

    if (s.temp_c != null) {
      $("temp").textContent = fmt0(s.temp_c);
      $("temp-bar").style.width = `${Math.min(s.temp_c, 100)}%`;
      const hot = s.temp_c >= 85;
      $("temp-status").classList.toggle("status-hot", hot);
      $("temp-status-txt").textContent = hot ? t("hot") : t("normal");
    } else {
      $("temp-card").hidden = true;
    }

    if (s.battery_pct != null) {
      $("battery").textContent = s.battery_pct;
      $("battery-bar").style.width = `${s.battery_pct}%`;
      $("battery-status").textContent =
        s.battery_status === "Charging" ? t("charging") :
        s.battery_status === "Discharging" ? t("onBattery") : t("onAc");
      if (s.battery_limit_pct != null) {
        $("battery-limit").hidden = false;
        $("battery-limit").textContent = t("limitPct", s.battery_limit_pct);
        $("battery-cap").hidden = false;
        $("battery-cap").style.left = `${s.battery_limit_pct}%`;
        $("battery-note").textContent = t("chargeCapped");
      }
    } else {
      $("battery-card").hidden = true;
    }

    const [rv, ru, rf] = rateUnit(s.net_rx_bps);
    $("net-rx").textContent = rf(rv); $("net-rx-unit").textContent = ru;
    const [tv, tu, tf] = rateUnit(s.net_tx_bps);
    $("net-tx").textContent = tf(tv); $("net-tx-unit").textContent = tu;

    $("uptime").textContent = fmtUptime(s.uptime_secs);
    $("sys-procs").textContent = s.processes != null ? fmt0(s.processes) : "—";
  }

  function renderHistory(h) {
    if (!h.length) return;
    sparkline("spark-cpu", decimate(h.map((x) => x.cpu_pct)), 100);
    const memTotalHint = Math.max(...h.map((x) => x.mem_used)) * 1.4;
    sparkline("spark-mem", decimate(h.map((x) => x.mem_used)), memTotalHint);
    sparkline("spark-net", decimate(h.map((x) => x.net_rx_bps)));
    const peak = Math.max(...h.map((x) => x.cpu_pct));
    $("cpu-sub").textContent = t("last24hPeak", fmt0(peak));
  }

  const relTime = (secs) => {
    const d = Math.floor(secs / 86400), h = Math.floor((secs % 86400) / 3600), m = Math.floor((secs % 3600) / 60);
    if (d > 0) return d === 1 ? t("dayOne") : t("days", d);
    if (h > 0) return h === 1 ? t("hourOne") : t("hours", h);
    if (m > 0) return t("mins", m);
    return t("now");
  };
  const nowSecs = () => Math.floor(Date.now() / 1000);

  function sparkSvgInner(values, max, W, H) {
    if (!values.length) return "";
    const PAD = 5;
    const top = max ?? Math.max(...values, 1e-9);
    const pts = values.map((v, i) => {
      const x = values.length === 1 ? W : (i / (values.length - 1)) * W;
      const y = H - PAD - Math.min(v / top, 1) * (H - 2 * PAD);
      return [x, y];
    });
    const line = pts.map(([x, y], i) => `${i ? "L" : "M"}${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
    const [lx, ly] = pts[pts.length - 1];
    return `<line x1="0" y1="${H / 2}" x2="${W}" y2="${H / 2}" stroke="rgba(140,165,215,0.12)" stroke-width="1"></line>` +
      `<path d="${line} L${W},${H} L0,${H} Z" fill="rgba(79,139,255,0.16)"></path>` +
      `<path d="${line}" fill="none" stroke="#4f8bff" stroke-width="2" stroke-linecap="round"></path>` +
      `<circle cx="${lx}" cy="${ly}" r="3" fill="#4f8bff" stroke="var(--spark-ring)" stroke-width="2"></circle>`;
  }

  // sparkline that answers "when was the peak?" on hover
  function interactiveSpark(id, series, max, fmt, windowed) {
    const host = $(id);
    if (!host || !series.length) return;
    const W = 300, H = 34, PAD = 5;
    // memory barely moves: scaling from zero paints a solid block, so a
    // windowed series is drawn between its own min and max
    const values = series.map((p) => p.v);
    const lo = windowed ? Math.min(...values) : 0;
    const hi = windowed ? Math.max(...values) : (max ?? Math.max(...values, 1e-9));
    const span = Math.max(hi - lo, 1e-9);
    const pts = series.map((p, i) => [
      series.length === 1 ? W : (i / (series.length - 1)) * W,
      H - PAD - Math.min(Math.max((p.v - lo) / span, 0), 1) * (H - 2 * PAD),
    ]);
    const line = pts.map(([x, y], i) => `${i ? "L" : "M"}${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
    const peak = series.reduce((a, b) => (b.v > a.v ? b : a), series[0]);
    host.innerHTML = `
      <svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
        <line x1="0" y1="${H / 2}" x2="${W}" y2="${H / 2}" stroke="rgba(140,165,215,0.12)" stroke-width="1"></line>
        <path d="${line} L${W},${H} L0,${H} Z" fill="rgba(79,139,255,0.16)"></path>
        <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"></path>
        <circle cx="${pts[pts.length - 1][0]}" cy="${pts[pts.length - 1][1]}" r="3" fill="var(--accent)" stroke="var(--spark-ring)" stroke-width="2"></circle>
      </svg>
      <div class="spark-cursor" hidden></div>
      <div class="spark-tip" hidden></div>`;
    const svg = host.querySelector("svg");
    const tip = host.querySelector(".spark-tip");
    const cur = host.querySelector(".spark-cursor");
    const move = (ev) => {
      const box = host.getBoundingClientRect();
      const x = Math.max(0, Math.min(box.width, ev.clientX - box.left));
      const i = Math.round((x / box.width) * (series.length - 1));
      const p = series[i];
      if (!p) return;
      tip.hidden = false; cur.hidden = false;
      cur.style.left = `${(i / Math.max(series.length - 1, 1)) * box.width}px`;
      tip.style.left = cur.style.left;
      tip.textContent = `${fmt(p.v)} · ${t("agoW", relTime(nowSecs() - p.ts))}`;
    };
    svg.addEventListener("mousemove", move);
    svg.addEventListener("mouseleave", () => { tip.hidden = true; cur.hidden = true; });
    host.dataset.peak = `${fmt(peak.v)} · ${t("agoW", relTime(nowSecs() - peak.ts))}`;
  }

    return decimate((hist || []).map((h) => h[field]), 120).map((v, i, arr) => ({
      v,
      ts: (hist[Math.min(Math.round((i / Math.max(arr.length - 1, 1)) * (hist.length - 1)), hist.length - 1)] || {}).ts || 0,
    }));
  }

          <div class="dcard">
            <div class="dcard-title"><span class="label">${t("versionsTitle")}</span><span class="sub">${t("ghcr")}</span></div>
            ${versions}
          </div>
          <div class="dcard">
            <div class="dcard-title"><span class="label">${t("weightTitle")}</span></div>
            <div style="display:flex;flex-direction:column;gap:12px;padding:16px 20px">
              <div style="display:flex;justify-content:space-between;font-size:13px"><span style="color:var(--text-2)">${t("imageLbl")}</span><span class="cell-num">${fmtMem(d.image_bytes || 0)}</span></div>
              <div style="display:flex;justify-content:space-between;font-size:13px"><span style="color:var(--text-2)">${t("volumesLbl")}</span><span class="cell-num">${fmtMem(d.volume_bytes || 0)}</span></div>
              <div style="display:flex;justify-content:space-between;font-size:13px;padding-top:10px;border-top:1px solid var(--stroke)"><span style="font-weight:600">${t("totalLbl")}</span><span class="cell-num">${fmtMem(total)}</span></div>
            </div>
          </div>
          ${d.slug !== "webo" ? `
          <div class="dcard danger-card">
            <div class="dcard-title"><span class="label" style="color:var(--danger)">${t("delDanger")}</span></div>
            <div style="padding:16px 20px;display:flex;flex-direction:column;gap:10px">
              <span class="sub">${t("delGithubNote")}</span>
              <button class="btn-danger" id="proj-delete" style="width:fit-content">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"></path><path d="M10 11v6M14 11v6"></path></svg>
                ${t("delBtn")}
              </button>
            </div>
          </div>` : ""}
        </div>
      </div>
      <div class="dcard" id="errors-card" style="margin-top:16px"></div>
      <div class="dcard" id="logs-card" style="margin-top:16px"></div>
      <div class="dcard" id="data-card" style="margin-top:16px" hidden></div>`;
    $("proj-back").addEventListener("click", () => {
      currentProject = null;
      $("view-project-detail").hidden = true;
      $("view-projects").hidden = false;
      tickProjects();
    });
    currentDetail = d;
    wireDomains(d);
    // project total, with the peak available on hover
    interactiveSpark("spark-cpu-detail", seriesFrom(d.history, "cpu_pct"),
      Math.max(...(d.history || []).map((h) => h.cpu_pct), 5),
      (v) => `${v.toLocaleString(LOCALE, { maximumFractionDigits: 1 })}%`);
    interactiveSpark("spark-mem-detail", seriesFrom(d.history, "mem_bytes"), null, fmtMem, true);
    // one series per resource
    (d.containers || []).forEach((c, i) => {
      const hist = (d.container_history || {})[c.name] || [];
      interactiveSpark(`spark-res-cpu-${i}`, seriesFrom(hist, "cpu_pct"),
        Math.max(...hist.map((h) => h.cpu_pct), 5),
        (v) => `${v.toLocaleString(LOCALE, { maximumFractionDigits: 1 })}%`);
      interactiveSpark(`spark-res-mem-${i}`, seriesFrom(hist, "mem_bytes"), null, fmtMem, true);
      interactiveSpark(`spark-res-disk-${i}`, seriesFrom(hist, "disk_bps"),
        Math.max(...hist.map((h) => h.disk_bps || 0), 1024), (v) => fmtDisk(v));
    });
    document.querySelectorAll("[data-logs]").forEach((b) => {
      b.addEventListener("click", () => {
        logState.container = b.dataset.logs;
        loadLogs(d.slug);
      errState = { issues: [], snippet: "", open: null, events: [], loadedFor: null };
      loadErrors(d.slug);
        $("logs-card")?.scrollIntoView({ behavior: "smooth", block: "center" });
      });
    });
    if (!dbState.loadedFor || dbState.loadedFor !== d.slug) {
      dbState = { db: null, tables: [], table: null, write: false, loadedFor: d.slug, env: null };
      logState = { container: null, q: "", minutes: 60, lines: [], stored: 0, max: 0, loadedFor: null };
      loadDatabase(d.slug);
      loadEnv(d.slug);
      loadLogs(d.slug);
    } else {
      renderDatabaseCard(d.slug);
      renderDataTab(d.slug);
      renderLogs(d.slug);
      renderErrors(d.slug);
      // the card is rebuilt on every refresh: repaint it from what we have,
      // otherwise it sits on the loading placeholder forever
      if (dbState.env) renderEnvCard(d.slug, dbState.env); else loadEnv(d.slug);
    }
    const delBtn = $("proj-delete");
    if (delBtn) delBtn.addEventListener("click", () => openDeleteModal(d));
  }

  function domainsCard(d) {
    if (!d.domains_available && !d.auto_domain && !d.custom_domain) {
      return `<div class="dcard">
        <div class="dcard-title"><span class="label">${t("domains")}</span></div>
        <div class="empty-note">${t("domUnavailable")}</div>
      </div>`;
    }
    const row = (host, sub, badge, actions) => `
      <div class="drow">
        <div class="icon-sq" style="background:${hexSoft(badge === "live" ? "#3fca7c" : "#4f8bff", 0.14)}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${badge === "live" ? "var(--ok)" : "var(--accent)"}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12 L21 12"></path><path d="M12 3c2.5 2.4 3.8 5.6 3.8 9S14.5 18.6 12 21c-2.5-2.4-3.8-5.6-3.8-9S9.5 5.4 12 3Z"></path></svg>
        </div>
        <div style="display:flex;flex-direction:column;gap:2px;flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <a class="url-link" href="https://${esc(host)}" target="_blank" rel="noopener" style="font-family:var(--mono);font-size:13px;font-weight:500">${esc(host)}</a>
            ${badge === "live" ? `<span class="mono-badge" style="color:var(--ok);background:var(--ok-soft)">${t("domLive")}</span>` : ""}
          </div>
          <span class="sub">${sub}</span>
        </div>
        ${actions}
      </div>`;
    const rows = [];
    if (d.custom_domain) {
      rows.push(row(d.custom_domain, `${t("domOwn")} · ${t("domManaged")}`, "live",
        `<button class="btn-sm" id="dom-disconnect">${t("domDisconnect")}</button>`));
    }
    if (d.auto_domain) {
      rows.push(row(d.auto_domain, t("domAuto"), d.custom_domain ? "" : "live",
        `<button class="btn-sm" data-copy="https://${esc(d.auto_domain)}">${t("domCopy")}</button>`));
    }
    return `<div class="dcard">
      <div class="dcard-title"><span class="label">${t("domains")}</span><span class="sub">${t("domViaTunnel")}</span></div>
      ${rows.join("") || `<div class="empty-note">—</div>`}
      ${d.custom_domain ? "" : `
      <div style="display:flex;flex-direction:column;gap:12px;padding:16px 20px;border-top:1px solid var(--stroke)">
        <span class="label">${t("domConnectTitle")}</span>
        <div style="display:flex;gap:10px">
          <input class="dom-input" id="dom-input" placeholder="${t("domPh")}" autocomplete="off" spellcheck="false">
          <button class="btn-primary" id="dom-connect">${t("domConnect")}</button>
        </div>
        <span class="sub" id="dom-msg" hidden></span>
      </div>`}
    </div>`;
  }

  function wireDomains(d) {
    document.querySelectorAll("[data-copy]").forEach((b) => {
      b.addEventListener("click", async () => {
        try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = t("domCopied"); } catch {}
      });
    });
    const connect = $("dom-connect");
    if (connect) connect.addEventListener("click", async () => {
      const input = $("dom-input");
      const msg = $("dom-msg");
      const value = input.value.trim();
      if (!value) return;
      connect.disabled = true;
      try {
        const res = await fetch(`/api/v1/projects/${encodeURIComponent(d.slug)}/domain`, {
          method: "PUT",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ domain: value }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || res.status);
        if (data.dns_managed === false) {
          msg.hidden = false;
          msg.innerHTML = t("domCname", `<b style="font-family:var(--mono);color:var(--text)">${esc(data.cname_target)}</b>`);
        }
        tickProjects();
      } catch (e) {
        msg.hidden = false;
        msg.style.color = "var(--danger)";
        msg.textContent = t("domFail", e.message || "?");
      }
      connect.disabled = false;
    });
    const disc = $("dom-disconnect");
    if (disc) disc.addEventListener("click", async () => {
      disc.disabled = true;
      try {
        await fetch(`/api/v1/projects/${encodeURIComponent(d.slug)}/domain`, { method: "DELETE" });
        tickProjects();
      } catch {}
    });
  }

  // ---------- database, variables and the data tab ----------
  let dbState = { db: null, tables: [], table: null, write: false };
  let currentDetail = null;

  async function loadDatabase(slug) {
    try {
      const r = await (await fetch(`/api/v1/projects/${encodeURIComponent(slug)}/database`)).json();
      dbState.db = r.database || null;
    } catch { dbState.db = null; }
    renderDatabaseCard(slug);
    if (dbState.db) loadTables(slug);
  }

  function renderDatabaseCard(slug) {
    const card = $("db-card");
    if (!card) return;
    const db = dbState.db;
    if (!db) {
      card.innerHTML = `
        <div class="dcard-title"><span class="label">${t("dbTitle")}</span></div>
        <div class="db-empty">
          <span class="sub">${t("dbNone")}</span>
          <button class="btn-primary" id="db-create">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7.5" ry="3"></ellipse><path d="M4.5 6v12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V6"></path><path d="M4.5 12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3"></path></svg>
            ${t("dbCreate")}
          </button>
        </div>`;
      $("db-create").addEventListener("click", async (ev) => {
        const btn = ev.currentTarget;
        btn.disabled = true;
        btn.textContent = t("dbCreating");
        try {
          const res = await fetch(`/api/v1/projects/${encodeURIComponent(slug)}/database`, { method: "POST" });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || res.status);
          dbState.db = data.database;
          renderDatabaseCard(slug);
          loadEnv(slug);
          loadTables(slug);
        } catch (e) {
          card.querySelector(".db-empty").insertAdjacentHTML("beforeend",
            `<span class="sub" style="color:var(--danger)">${t("dataError", esc(e.message || "?"))}</span>`);
        }
      });
      return;
    }
    const pg = db.kind === "postgres";
    card.innerHTML = `
      <div class="dcard-title">
        <span class="label">${t("dbTitle")}</span>
        <span class="sub">${pg ? t("dbKindPg") : t("dbKindSqlite")}</span>
      </div>
      <div class="kv-row">
        <div class="icon-sq" style="background:${hexSoft(pg ? "#38bdf8" : "#3fca7c", 0.14)}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${pg ? "#38bdf8" : "var(--ok)"}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7.5" ry="3"></ellipse><path d="M4.5 6v12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V6"></path><path d="M4.5 12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3"></path></svg>
        </div>
        <div style="display:flex;flex-direction:column;gap:2px;flex:1;min-width:0">
          <span style="font-family:var(--mono);font-size:13px">${esc(pg ? (db.container || "") : (db.file_path || ""))}</span>
          <span class="sub">${pg ? esc(db.db_name || "") : esc(db.volume || "")}</span>
        </div>
        ${pg ? `<button class="btn-sm" id="db-drop">${t("dbDrop")}</button>` : ""}
      </div>
      ${!db.persisted ? `<div class="warn-strip" style="margin:12px 20px">⚠ ${t("dbNotPersisted")}</div>` : ""}`;
    const drop = $("db-drop");
    if (drop) drop.addEventListener("click", async () => {
      drop.disabled = true;
      await fetch(`/api/v1/projects/${encodeURIComponent(slug)}/database`, { method: "DELETE" });
      dbState = { db: null, tables: [], table: null, write: false };
      renderDatabaseCard(slug);
      loadEnv(slug);
      renderDataTab(slug);
    });
  }

  async function loadEnv(slug) {
    let data = { vars: [], expected: [], missing: [] };
    try { data = await (await fetch(`/api/v1/projects/${encodeURIComponent(slug)}/env`)).json(); } catch {}
    dbState.env = data;
    renderEnvCard(slug, data);
  }

  function renderEnvCard(slug, data) {
    const card = $("env-card");
    if (!card) return;
    const rows = (data.vars || []).map((v) => `
      <div class="kv-row">
        <span class="kv-key">${esc(v.key)}</span>
        <span class="kv-val" data-valfor="${esc(v.key)}">${esc(v.preview)}</span>
        <button class="btn-sm" data-reveal="${esc(v.key)}" title="${t("reveal")}" aria-label="${t("reveal")}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.6"></circle></svg>
        </button>
        ${v.managed ? `<span class="tag-managed">${t("envManaged")}</span>`
                    : `<button class="btn-sm" data-envdel="${esc(v.key)}">×</button>`}
      </div>`).join("");
    const missing = (data.missing || []).map((k) => `
      <div class="kv-row">
        <span class="kv-key" style="color:var(--text-3)">${esc(k)}</span>
        <span class="tag-missing">${t("envMissing")}</span>
      </div>`).join("");
    card.innerHTML = `
      <div class="dcard-title">
        <span class="label">${t("envTitle")}</span>
        <span class="sub">${(data.expected || []).length ? t("envExpected", data.expected.length) : ""}</span>
      </div>
      ${rows}${missing}
      <div style="display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--stroke)">
        <input class="dom-input" id="env-key" placeholder="${t("envKey")}" style="flex:0 0 34%;text-transform:uppercase">
        <input class="dom-input" id="env-value" placeholder="${t("envValue")}">
        <button class="btn-primary" id="env-save">${t("envSave")}</button>
      </div>
      <span class="sub" id="env-msg" style="padding:0 20px 14px" hidden></span>`;
    $("env-save").addEventListener("click", async () => {
      const key = $("env-key").value.trim().toUpperCase();
      const value = $("env-value").value;
      if (!key) return;
      const res = await fetch(`/api/v1/projects/${encodeURIComponent(slug)}/env`, {
        method: "PUT",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ key, value }),
      });
      const data = await res.json();
      if (!res.ok) {
        $("env-msg").hidden = false;
        $("env-msg").style.color = "var(--danger)";
        $("env-msg").textContent = t("dataError", data.error || res.status);
        return;
      }
      loadEnv(slug);
    });
    card.querySelectorAll("[data-reveal]").forEach((b) => {
      b.addEventListener("click", async () => {
        const key = b.dataset.reveal;
        const cell = card.querySelector(`[data-valfor="${key}"]`);
        if (!cell) return;
        if (cell.dataset.shown === "1") {
          cell.textContent = cell.dataset.masked;
          cell.dataset.shown = "0";
          b.title = t("reveal");
          return;
        }
        try {
          const r = await (await fetch(`/api/v1/projects/${encodeURIComponent(slug)}/env/${encodeURIComponent(key)}`)).json();
          cell.dataset.masked = cell.textContent;
          cell.textContent = r.value ?? "";
          cell.dataset.shown = "1";
          b.title = t("hide");
        } catch {}
      });
    });
    card.querySelectorAll("[data-envdel]").forEach((b) => {
      b.addEventListener("click", async () => {
        await fetch(`/api/v1/projects/${encodeURIComponent(slug)}/env?key=${encodeURIComponent(b.dataset.envdel)}`, { method: "DELETE" });
        loadEnv(slug);
      });
    });
  }

  async function loadTables(slug) {
    try {
      const r = await (await fetch(`/api/v1/projects/${encodeURIComponent(slug)}/database/tables`)).json();
      dbState.tables = r.tables || [];
    } catch { dbState.tables = []; }
    renderDataTab(slug);
  }

  async function runSql(slug, sql, write) {
    const res = await fetch(`/api/v1/projects/${encodeURIComponent(slug)}/database/query`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ sql, write }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.status);
    return data;
  }

  function renderResult(data) {
    const out = $("sql-result");
    if (!out) return;
    if (!data.columns || !data.columns.length) {
      out.innerHTML = `<div class="empty-note">${esc((data.raw || t("dataEmpty")).trim().slice(0, 400))}</div>`;
      return;
    }
    const head = data.columns.map((c) => `<th>${esc(c)}</th>`).join("");
    const body = data.rows.map((r) => `<tr>${r.map((c) => `<td>${esc(c)}</td>`).join("")}</tr>`).join("");
    out.innerHTML = `
      <div class="grid-wrap"><table class="data"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
      <div style="padding:10px 20px" class="sub">${t("dataRows", data.row_count)}${data.truncated ? " · " + t("dataTruncated") : ""}</div>`;
  }

  function renderDataTab(slug) {
    const host = $("data-card");
    if (!host) return;
    if (!dbState.db) { host.hidden = true; return; }
    host.hidden = false;
    const chips = dbState.tables.length
      ? dbState.tables.map((tb) => `<button class="table-chip${dbState.table === tb ? " on" : ""}" data-table="${esc(tb)}">${esc(tb)}</button>`).join("")
      : `<span class="sub">${t("dataNoTables")}</span>`;
    host.innerHTML = `
      <div class="dcard-title"><span class="label">${t("dataTitle")}</span><span class="sub">${dbState.db.kind}</span></div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;padding:14px 20px">${chips}</div>
      <div style="display:flex;flex-direction:column;gap:10px;padding:0 20px 16px">
        <textarea class="sql-box" id="sql-input" spellcheck="false" placeholder="SELECT * FROM ...">${esc(dbState.sql || "")}</textarea>
        <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
          <button class="btn-primary" id="sql-run">${t("dataRun")}</button>
          <label class="write-toggle${dbState.write ? " write-on" : ""}">
            <input type="checkbox" id="sql-write" ${dbState.write ? "checked" : ""}>
            ${dbState.write ? t("dataWriteOn") : t("dataWrite")}
          </label>
        </div>
      </div>
      <div id="sql-result"></div>`;
    host.querySelectorAll("[data-table]").forEach((b) => {
      b.addEventListener("click", async () => {
        dbState.table = b.dataset.table;
        dbState.sql = `SELECT * FROM ${b.dataset.table} LIMIT 50;`;
        renderDataTab(slug);
        try { renderResult(await runSql(slug, dbState.sql, false)); }
        catch (e) { $("sql-result").innerHTML = `<div class="empty-note" style="color:var(--danger)">${t("dataError", esc(e.message))}</div>`; }
      });
    });
    $("sql-write").addEventListener("change", (ev) => { dbState.write = ev.target.checked; renderDataTab(slug); });
    $("sql-run").addEventListener("click", async () => {
      dbState.sql = $("sql-input").value;
      $("sql-run").disabled = true;
      try { renderResult(await runSql(slug, dbState.sql, dbState.write)); }
      catch (e) { $("sql-result").innerHTML = `<div class="empty-note" style="color:var(--danger)">${t("dataError", esc(e.message))}</div>`; }
      $("sql-run").disabled = false;
    });
  }

  // ---------- errors ----------
  let errState = { issues: [], snippet: "", open: null, events: [], loadedFor: null };

  async function loadErrors(slug) {
    try {
      const r = await (await fetch(`/api/v1/projects/${encodeURIComponent(slug)}/errors`)).json();
      errState.issues = r.issues || [];
      errState.snippet = r.snippet || "";
      errState.loadedFor = slug;
    } catch { errState.issues = []; }
    renderErrors(slug);
  }

  function renderErrors(slug) {
    const card = $("errors-card");
    if (!card) return;
    const when = (ts) => t("agoW", relTime(nowSecs() - ts));
    const rows = errState.issues.map((i) => `
      <div>
        <div class="issue-row" data-issue="${i.id}">
          <span class="issue-count">${t("errCount", i.count)}</span>
          <div style="display:flex;flex-direction:column;gap:2px;min-width:0;flex:1">
            <span style="font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(i.title)}</span>
            <span class="sub">${t("errFirst")} ${when(i.first_seen)} · ${t("errLast")} ${when(i.last_seen)}</span>
          </div>
          <span class="role-badge" style="color:${i.source === "browser" ? "#eab308" : "var(--accent)"};background:${hexSoft(i.source === "browser" ? "#eab308" : "#4f8bff", 0.14)}">${i.source === "browser" ? t("errBrowser") : t("errServer")}</span>
          <button class="btn-sm" data-resolve="${i.id}">${t("errResolve")}</button>
        </div>
        ${errState.open === i.id ? `<div class="issue-events">${(errState.events || []).map((e) => `
          <div class="log-line">
            <span class="log-ts">${new Date(e.ts * 1000).toLocaleString(LOCALE, { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}</span>
            <span class="log-src">${esc(e.origin)}</span>
            <span class="log-txt">${esc(e.message)}</span>
          </div>`).join("") || `<div class="empty-note">—</div>`}</div>` : ""}
      </div>`).join("");
    card.innerHTML = `
      <div class="dcard-title"><span class="label">${t("errors")}</span><span class="sub">${errState.issues.length ? t("errOccurrences") : ""}</span></div>
      ${rows || `<div class="empty-note">${t("errNone")}</div>`}
      <div style="display:flex;flex-direction:column;gap:8px;padding:16px 20px;border-top:1px solid var(--stroke)">
        <span class="label">${t("errSnippet")}</span>

    card.querySelectorAll("[data-issue]").forEach((row) => {
      row.addEventListener("click", async (ev) => {
        if (ev.target.closest("[data-resolve]")) return;
        const id = Number(row.dataset.issue);
        if (errState.open === id) { errState.open = null; renderErrors(slug); return; }
        try {
          const r = await (await fetch(`/api/v1/projects/${encodeURIComponent(slug)}/errors/${id}`)).json();
          errState.open = id;
          errState.events = r.events || [];
        } catch {}
        renderErrors(slug);
      });
    });
    card.querySelectorAll("[data-resolve]").forEach((b) => {
      b.addEventListener("click", async (ev) => {
        ev.stopPropagation();
        await fetch(`/api/v1/projects/${encodeURIComponent(slug)}/errors/${b.dataset.resolve}`, {
          method: "PUT",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ resolved: true }),
        });
        loadErrors(slug);
      });
    });
    const copy = $("err-copy");
    if (copy) copy.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(errState.snippet); copy.textContent = t("errCopied"); } catch {}
    });

  // ---------- logs ----------
  let logState = { container: null, q: "", minutes: 60, lines: [], stored: 0, max: 0, loadedFor: null };

  async function loadLogs(slug) {
    const params = new URLSearchParams();
    if (logState.q) params.set("q", logState.q);
    if (logState.container) params.set("container", logState.container);
    if (logState.minutes) params.set("minutes", String(logState.minutes));
    params.set("limit", "300");
    try {
      const r = await (await fetch(`/api/v1/projects/${encodeURIComponent(slug)}/logs?${params}`)).json();
      logState.lines = r.lines || [];
      logState.stored = r.stored_bytes || 0;
      logState.max = r.max_bytes || 0;
      logState.loadedFor = slug;
    } catch { logState.lines = []; }
    renderLogs(slug);
  }

  function renderLogs(slug) {
    const card = $("logs-card");
    if (!card) return;
    const windows = [
      [15, t("logs15m")], [60, t("logs1h")], [1440, t("logs24h")], [10080, t("logs7d")], [0, t("logsAllTime")],
    ];
    const chips = windows.map(([m, label]) =>
      `<button class="table-chip${logState.minutes === m ? " on" : ""}" data-win="${m}">${label}</button>`).join("");
    const sources = [["", t("logsAll")], ...((currentDetail?.containers || []).map((c) => [c.name, c.name]))];
    const srcChips = sources.map(([v, label]) =>
      `<button class="table-chip${(logState.container || "") === v ? " on" : ""}" data-src="${esc(v)}">${esc(label)}</button>`).join("");
    const fmtTs = (ts) => new Date(ts * 1000).toLocaleString(LOCALE, { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" });
    const body = logState.lines.length
      ? `<div class="log-scroll">${logState.lines.map((l) => `
          <div class="log-line${l.stream === "stderr" || /error|fatal|exception/i.test(l.line) ? " log-err" : ""}">
            <span class="log-ts">${fmtTs(l.ts)}</span>
            <span class="log-src">${esc(l.container)}</span>
            <span class="log-txt">${esc(l.line)}</span>
          </div>`).join("")}</div>`
      : `<div class="empty-note">${t("logsEmpty")}</div>`;
    card.innerHTML = `
      <div class="dcard-title">
        <span class="label">${t("logs")}</span>
        <span class="sub">${logState.max ? t("logsStored", fmtMem(logState.stored), fmtMem(logState.max)) : ""}</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;padding:14px 20px">
        <div class="search-box" style="width:100%">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20 L16.5 16.5"></path></svg>
          <input id="logs-q" type="search" autocomplete="off" placeholder="${t("logsSearch")}" value="${esc(logState.q)}">
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">${srcChips}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <span class="sub">${t("logsWindow")}</span>${chips}
        </div>
      </div>
      ${body}`;
    const input = $("logs-q");
    input.addEventListener("input", () => {
      logState.q = input.value;
      clearTimeout(logState.timer);
      logState.timer = setTimeout(() => loadLogs(slug), 350);
    });
    card.querySelectorAll("[data-win]").forEach((b) =>
      b.addEventListener("click", () => { logState.minutes = Number(b.dataset.win); loadLogs(slug); }));
    card.querySelectorAll("[data-src]").forEach((b) =>
      b.addEventListener("click", () => { logState.container = b.dataset.src || null; loadLogs(slug); }));
  }

  function openDeleteModal(d) {
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML = `
      <div class="modal-card">
        <div style="display:flex;flex-direction:column;gap:4px">
          <span style="font-size:17px;font-weight:700;color:var(--danger)">${t("delTitle", esc(d.name))}</span>
          <span class="sub">${t("delGithubNote")}</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px">
          <span class="label">${t("delWhat")}</span>
          <label class="check-row"><input type="checkbox" id="del-containers" checked><span>${t("delContainers")}</span></label>
          <label class="check-row"><input type="checkbox" id="del-volumes"><span style="color:var(--danger)">${t("delVolumes")}</span></label>
          <label class="check-row"><input type="checkbox" id="del-images"><span>${t("delImages")}</span></label>
          <span class="sub" id="del-warn" hidden>⚠ ${t("delRediscover")}</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <span class="sub">${t("delType", `<b style="font-family:var(--mono);color:var(--text)">${esc(d.slug)}</b>`)}</span>
          <input class="del-input" id="del-name" autocomplete="off" spellcheck="false">
        </div>
        <span class="sub" id="del-error" style="color:var(--danger)" hidden></span>
        <div style="display:flex;gap:10px;justify-content:flex-end">
          <button class="btn-ghost" id="del-cancel">${t("delCancel")}</button>
          <button class="btn-danger solid" id="del-go" disabled>${t("delConfirm")}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const q = (id) => overlay.querySelector("#" + id);
    const syncWarn = () => { q("del-warn").hidden = q("del-containers").checked || !d.running; };
    syncWarn();
    q("del-containers").addEventListener("change", syncWarn);
    q("del-name").addEventListener("input", () => { q("del-go").disabled = q("del-name").value.trim() !== d.slug; });
    const close = () => overlay.remove();
    q("del-cancel").addEventListener("click", close);
    overlay.addEventListener("click", (ev) => { if (ev.target === overlay) close(); });
    q("del-go").addEventListener("click", async () => {
      q("del-go").disabled = true;
      try {
        const res = await fetch(`/api/v1/projects/${encodeURIComponent(d.slug)}`, {
          method: "DELETE",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            containers: q("del-containers").checked,
            volumes: q("del-volumes").checked,
            images: q("del-images").checked,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || res.status);
        close();
        currentProject = null;
        $("view-project-detail").hidden = true;
        $("view-projects").hidden = false;
        tickProjects();
      } catch (e) {
        q("del-error").hidden = false;
        q("del-error").textContent = t("delFail", e.message || "?");
        q("del-go").disabled = false;
      }
    });
    q("del-name").focus();
  }

  function wizHeader() {

      return `<div class="step-chip ${cls}">${inner}${labels[n - 1]}</div>` +
        (n < 3 ? `<span style="color:var(--text-3);font-size:12px">→</span>` : "");

          const right = r.already_project

          return `<div class="${cls}" data-repo="${esc(key)}" ${r.already_project ? "" : 'role="button" tabindex="0"'}>

    const selName = wiz.sel ? wiz.sel.split("/")[1] : null;

    search.addEventListener("input", () => { wiz.q = search.value; renderWizStep1(); $("wiz-search").focus(); const v = $("wiz-search").value; $("wiz-search").setSelectionRange(v.length, v.length); });

    $("wiz-continue").addEventListener("click", async () => {

          </div>
          <div style="display:flex;flex-direction:column;gap:6px">
            <span style="font-size:17px;font-weight:700">${t("wizBlockedTitle", esc(lang))}</span>
            <span style="font-family:var(--mono);font-size:12px;color:var(--text-3)">${esc(wiz.sel)}</span>
          </div>
          <span style="font-size:13.5px;color:var(--text-2);line-height:1.6;max-width:420px">${t("wizBlockedBody", esc(lang))}</span>
          <button class="btn-ghost" id="wiz-blocked-back">${t("wizBack")}</button>
        </div>
      </div>`;
    wireWizCommon();
    $("wiz-blocked-back").addEventListener("click", () => { wiz.step = 1; wiz.plan = null; renderWizStep1(); });
  }

  function progRow(state, title, sub) {
    const icon = state === "done"
      ? `<div class="prog-icon" style="background:var(--ok-soft)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--ok)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5 L9.5 17.5 L19.5 6.5"></path></svg></div>`
      : state === "fail"
        ? `<div class="prog-icon" style="background:rgba(229,72,77,0.14)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2.6" stroke-linecap="round"><path d="M6 6 L18 18 M18 6 L6 18"></path></svg></div>`
        : state === "run"
          ? `<div class="prog-icon" style="background:var(--accent-soft)"><div class="spin"></div></div>`
          : `<div class="prog-icon" style="background:var(--surface-3)"><span class="mini-dot2" style="background:var(--text-3)"></span></div>`;
    return `<div class="wrow" style="padding:14px 20px;${state === "wait" ? "opacity:0.55" : ""}">
      ${icon}
      <div style="display:flex;flex-direction:column;gap:2px;flex:1;min-width:0">
        <span style="font-weight:600;font-size:13.5px">${title}</span>
        <span style="font-size:12px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${sub}</span>
      </div>
    </div>`;
  }

  async function pollFirstDeploy() {
    if (!wiz || !wiz.slug) { stopWizPoll(); return; }
    try {
      const d = await (await fetch(`/api/v1/projects/${encodeURIComponent(wiz.slug)}`)).json();
      renderWizStep3(d);
      if (d.running && d.builds && d.builds[0] && d.builds[0].status === "completed") stopWizPoll();
    } catch {}
  }

  function renderWizStep3(detail) {
    if (!wiz || wiz.step !== 3 || $("view-wizard").hidden) return;
    const prov = wiz.provision;
    const kind = wiz.plan.template === "rails" ? KINDS.ruby : KINDS.next;
    const build = detail && detail.builds && detail.builds[0];
    const buildState = !build ? "run" : build.status !== "completed" ? "run" : build.conclusion === "success" ? "done" : "fail";
    const buildSub = build
      ? `${esc(build.workflow || "Deploy")} · ${esc(build.commit_msg)} · ${build.duration_secs}s`
      : "…";
    const serverState = buildState === "done" ? "done" : buildState === "fail" ? "fail" : "wait";
    const upState = detail && detail.running ? "done" : serverState === "done" ? "run" : "wait";
    const allDone = upState === "done";
    const failed = buildState === "fail";
    const secretsAll = (prov.secrets || []).every((x) => x.status === "created");
    const secretsSub = (prov.secrets || []).map((x) => `${x.name}${x.status !== "created" ? " ✗" : ""}`).join(" · ");
    const repoUrl = `https://github.com/${wiz.sel}/actions`;
    $("view-wizard").innerHTML = wizHeader() + `
      <div style="display:grid;grid-template-columns:1.2fr 1fr;gap:16px;max-width:1100px;margin:0 auto" class="wiz-cols">
        <div style="display:flex;flex-direction:column;gap:16px">
          <div class="dcard" style="padding:20px 22px;flex-direction:row;align-items:center;gap:13px;overflow:visible">
            <div class="proj-icon" style="width:44px;height:44px;background:${hexSoft(kind.color, 0.14)}">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="${kind.color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${kind.icon}</svg>
            </div>
            <div style="display:flex;flex-direction:column;gap:3px;flex:1">
              <div style="display:flex;align-items:center;gap:9px">
                <span style="font-size:17px;font-weight:700">${esc(wiz.plan.slug)}</span>
                <span class="pill" style="color:${failed ? "var(--danger)" : "var(--accent)"};background:${failed ? "rgba(229,72,77,0.14)" : "var(--accent-soft)"}">${failed ? t("wizFailed") : t("wizFirstDeploy")}</span>
              </div>
              <span style="font-family:var(--mono);font-size:12px;color:var(--text-3)">${esc(wiz.sel)} · ${techLabel()}</span>
            </div>
          </div>
          <div class="dcard">
            <div class="dcard-title"><span class="label">${t("wizLive")}</span><span class="sub">${t("wizEvery")}</span></div>
            ${progRow("done", t("wizStepCommit"), `${t("filesN", (prov.files || []).length)} · ${esc((prov.commit_sha || "").slice(0, 7))}`)}
            ${progRow(secretsAll ? "done" : "fail", t("wizStepSecrets"), esc(secretsSub))}
            ${prov.auto_domain ? progRow("done", t("domReserved"), esc(prov.auto_domain)) : ""}
            ${progRow(buildState, t("wizStepBuild"), buildSub)}
            ${progRow(serverState, t("wizStepServer"), "webo-deploy · pull + compose up")}
            ${progRow(upState, t("wizStepUp"), t("wizStepUpSub"))}
          </div>
          ${allDone ? `<button class="btn-primary" id="wiz-see-project" style="justify-content:center;height:46px;font-size:14px">${t("wizSeeProject")}</button>` : ""}
        </div>
        <div style="display:flex;flex-direction:column;gap:16px">
          <div class="dcard" style="padding:20px 22px;gap:12px;overflow:visible">
            <span class="label">${t("wizMeanwhile")}</span>
            <span style="font-size:13px;color:var(--text-2);line-height:1.55">${t("wizCanClose")}</span>
            <a class="btn-ghost" style="width:fit-content;text-decoration:none" href="${repoUrl}" target="_blank" rel="noopener">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M9 19c-4 1.5-4-2-6-2"></path></svg>
              ${t("wizSeeRun")}
            </a>
          </div>
        </div>
      </div>`;
    wireWizCommon();
    const see = $("wiz-see-project");
    if (see) see.addEventListener("click", () => closeWizard(true));
  }

  function wireWizCommon() {
    const back = $("wiz-back");
    if (back) back.addEventListener("click", () => {
      if (!wiz) return;
      if (wiz.step === 2) { wiz.step = 1; wiz.plan = null; wiz.error = null; renderWizStep1(); }
      else if (wiz.step === 3) { closeWizard(false); }
      else closeWizard(false);
    });
  }

  async function openWizard() {
    stopWizPoll();
    wiz = { step: 1, repos: null, q: "", sel: null };
    ["view-overview", "view-processes", "view-projects", "view-project-detail"].forEach((v) => { $(v).hidden = true; });
    $("view-wizard").hidden = false;
    renderWizStep1();
    try {
      const res = await fetch("/api/v1/github/repos");
      const data = await res.json();
      if (!res.ok) { wiz.error = t("wizError", data.error || res.status); }
      else wiz.repos = data.repos || [];
    } catch { wiz.error = t("wizError", "network"); }
    if (wiz && wiz.step === 1) renderWizStep1();
  }
  $("wiz-open").addEventListener("click", openWizard);

  // ---------- tabs ----------
  const tabs = [
    { btn: "tab-overview", views: ["view-overview"] },
    { btn: "tab-processes", views: ["view-processes"] },
    { btn: "tab-projects", views: ["view-projects", "view-project-detail"] },
  ];
  const allViews = ["view-overview", "view-processes", "view-projects", "view-project-detail", "view-wizard"];
  tabs.forEach(({ btn, views }) => {
    $(btn).addEventListener("click", () => {
      tabs.forEach((tb) => $(tb.btn).classList.toggle("on", tb.btn === btn));
      allViews.forEach((v) => { $(v).hidden = true; });
      stopWizPoll(); wiz = null;
      if (btn === "tab-projects" && currentProject) {
        $("view-project-detail").hidden = false;
      } else {
        $(views[0]).hidden = false;
        if (btn !== "tab-projects") currentProject = null;
      }
      $("proc-search-box").hidden = btn !== "tab-processes";
      if (btn === "tab-processes") tickProcesses();
      if (btn === "tab-projects") tickProjects();
    });
  });

  loadSystem().then(() => {}).catch(() => {});
  fetch("/api/v1/system").then((r) => r.json()).then((s) => { machineMem = s.mem_total || 0; }).catch(() => {});
  tick(); tickHistory(); tickProcesses(); tickProjects();
  setInterval(tick, 15000);
  setInterval(tickHistory, 60000);
  setInterval(tickProcesses, 15000);
  setInterval(tickProjects, 15000);
})();
</script>
</body>
</html>
