[package]
name = "webo"
version = "0.1.0"
edition = "2021"
description = "Self-hosted server health panel — CPU, RAM, disk, temperature, network — featherweight."
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
rusqlite = { version = "0.32", features = ["bundled"] }
bollard = "0.18"
futures-util = "0.3"
ureq = { version = "2", features = ["json"] }
time = { version = "0.3", features = ["parsing", "formatting"] }
crypto_box = { version = "0.9", features = ["seal"] }
base64 = "0.22"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
lto = "thin"
