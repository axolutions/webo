# webo — run with: docker compose -f deploy/docker-compose.yml up -d --build
# Panel at http://<server>:5050
name: webo
services:
  webo:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "5050:5050"
    pid: host                # host processes and CPU/memory, not the container's
    restart: unless-stopped
    environment:
      - WEBO_NET_DEV=/host/proc_net_dev
      - WEBO_DB_PATH=/data/webo.db
    volumes:
      - webo-data:/data                                # project metadata (SQLite)
      - /var/run/docker.sock:/var/run/docker.sock:ro   # project discovery + container metrics (optional)
      - /proc/net/dev:/host/proc_net_dev:ro            # host network rates (optional)
      - /sys:/sys:ro                                   # temperature and battery (optional)
      - /etc/hostname:/host/etc/hostname:ro            # real host name (optional)
      - /etc/os-release:/host/etc/os-release:ro        # real host OS (optional)

volumes:
  webo-data:
