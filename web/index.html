        <div class="dcard">
          <div class="db-side-tabs seg sm" id="db-tabs"></div>
          <div id="db-side"></div>
          <div class="side-foot">
            <span style="display:flex;align-items:center;gap:7px"><span class="mini-dot" style="background:var(--ok)"></span>
              ${isPg ? esc(t("pgBadge")) : t("sqliteBadge")}</span>
            ${isPg ? `<div><button class="btn-sm" id="db-conn" style="margin-top:8px">${t("connString")}</button></div>
            <div><button class="btn-danger sm" id="db-drop" style="margin-top:8px">${t("dropDb")}</button></div>` : ""}
            ${!D.database.persisted ? `<div class="warn-strip" style="margin-top:10px">${t("notPersisted")}</div>` : ""}
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:14px;min-width:0" id="db-main"></div>
      </div>`;
    const tabs = isPg ? [["tables", "dbTables"], ["sql", "dbSql"], ["backups", "dbBackups"]] : [["tables", "dbTables"], ["sql", "dbSql"]];
    const drawTabs = () => {
      $("db-tabs").innerHTML = tabs.map(([k, lbl]) => `<button class="seg-btn${D.view === k ? " on" : ""}" data-dbv="${k}">${t(lbl)}</button>`).join("");
      $("db-tabs").querySelectorAll("[data-dbv]").forEach((b) =>
        b.addEventListener("click", () => { D.view = b.dataset.dbv; drawTabs(); drawSide(); drawMain(); }));
    };
    $("db-conn")?.addEventListener("click", async () => {
      try {
        const j = await api(`/api/v1/projects/${encodeURIComponent(S.scope)}/env/DATABASE_URL`);
        prompt("DATABASE_URL", j.value);
      } catch {}
    });
    $("db-drop")?.addEventListener("click", async () => {
      if (!confirm(t("dropDbConfirm"))) return;
      try { await fetch(`/api/v1/projects/${encodeURIComponent(S.scope)}/database`, { method: "DELETE" }); D.database = undefined; D.tables = []; render(); } catch {}
    });

    const drawSide = () => {
      const host = $("db-side");
      if (D.view === "tables") {
        host.innerHTML = `
          <div style="padding:12px 12px 6px"><div class="search-box" style="height:33px">${SEARCH_SVG}<input id="db-tq" placeholder="${esc(t("searchTable"))}" style="font-size:12.5px"></div></div>
          <div class="scope-label" style="padding-left:14px">${t("schemaN", D.tables.length)}</div>
          <div class="side-list" id="db-tlist"></div>`;
        const drawList = (q = "") => {
          $("db-tlist").innerHTML = D.tables.filter((n) => !q || n.includes(q)).map((n) => `
            <button class="side-row${D.table === n ? " on" : ""}" data-tb="${esc(n)}">
              <span class="lft"><span class="nm" style="font-family:var(--mono);font-size:12.5px">${esc(n)}</span></span>
              <span class="ct">${D.counts[n] != null ? t("rowsApprox") + fmtInt(D.counts[n]) : ""}</span></button>`).join("");
          $("db-tlist").querySelectorAll("[data-tb]").forEach((b) =>
            b.addEventListener("click", () => { D.table = b.dataset.tb; D.offset = 0; D.order = null; D.rows = null; drawSide(); drawMain(); }));
        };
        drawList();
        $("db-tq").addEventListener("input", debounce(() => drawList($("db-tq").value.trim()), 120));
      } else if (D.view === "sql") {
        host.innerHTML = `
          <div class="side-list">
            <button class="side-row" id="db-newq" style="color:var(--accent);font-weight:600"><span class="lft"><span class="nm">${t("newQuery")}</span></span></button>
          </div>
          <div class="scope-label" style="padding-left:14px">${t("savedQ")}</div>
          <div class="side-list" id="db-qlist"></div>`;
        $("db-newq").addEventListener("click", () => { D.qName = ""; D.sql = ""; D.result = null; drawMain(); });
        const drawQ = () => {
          $("db-qlist").innerHTML = D.queries.map((q) => `
            <button class="side-row${D.qName === q.name ? " on" : ""}" data-q="${esc(q.name)}">
              <span class="lft"><span class="nm">${esc(q.name)}</span></span>
              <span class="ct">${q.last_run_at ? t("ranAgo", t("agoW", relTime(nowSecs() - q.last_run_at))) : t("neverRan")}</span></button>`).join("")
            || `<div class="empty-note" style="padding:14px">${t("noneYet")}</div>`;
          $("db-qlist").querySelectorAll("[data-q]").forEach((b) =>
            b.addEventListener("click", () => {
              const q = D.queries.find((x) => x.name === b.dataset.q);
              if (q) { D.qName = q.name; D.sql = q.sql; D.result = null; drawQ(); drawMain(); }
            }));
        };
        drawQ();
        api(`/api/v1/projects/${encodeURIComponent(S.scope)}/database/queries`).then((j) => { D.queries = j.queries || []; drawQ(); }).catch(() => {});
      } else {
        host.innerHTML = `<div class="side-foot" style="border-top:0">${t("backupDaily")}</div>`;
      }
    };

    const drawMain = () => {
      const host = $("db-main");
      if (D.view === "tables") drawTableBrowser(host);
      else if (D.view === "sql") drawSqlEditor(host);
      else drawBackups(host);
    };
    drawTabs(); drawSide(); drawMain();
  }

  async function drawTableBrowser(host) {
    const D = S.db;
    if (!D.table) { host.innerHTML = `<div class="dcard"><div class="empty-note">${t("noneYet")}</div></div>`; return; }
    host.innerHTML = `<div class="dcard"><div class="empty-note">${t("loading")}</div></div>`;
    const params = new URLSearchParams({ limit: "50", offset: String(D.offset) });
    if (D.order) { params.set("order", D.order); params.set("dir", D.dir); }
    let data;
    try { data = await api(`/api/v1/projects/${encodeURIComponent(S.scope)}/database/tables/${encodeURIComponent(D.table)}/rows?${params}`); }
    catch (e) { host.innerHTML = `<div class="dcard"><div class="empty-note">${esc(e.message)}</div></div>`; return; }
    if (S.tab !== "db" || D.view !== "tables") return;
    D.rows = data;
    const from = data.total ? D.offset + 1 : 0;
    const to = Math.min(D.offset + (data.rows || []).length, data.total);
    host.innerHTML = `
      <div class="dcard">
        <div class="dcard-title">
          <div style="display:flex;align-items:baseline;gap:10px;min-width:0">
            <b style="font-family:var(--mono);font-size:14.5px">${esc(D.table)}</b>
            <span class="sub">${t("rowsMeta", fmtInt(data.total), (data.columns || []).length)}</span>
          </div>
          <div style="display:flex;gap:8px">
            <button class="btn-sm" id="tb-csv">${t("exportCsv")}</button>
            <button class="btn-sm${D.insertOpen ? " on" : ""}" id="tb-add">${t("addRow")}</button>
          </div>
        </div>
        <div id="tb-insert" ${D.insertOpen ? "" : "hidden"}></div>
        <div class="grid-wrap"><table class="data">
          <thead><tr>${(data.columns || []).map((c) => `<th data-col="${esc(c)}">${esc(c)}${D.order === c ? (D.dir === "asc" ? " ↑" : " ↓") : ""}</th>`).join("")}</tr></thead>
          <tbody>${(data.rows || []).map((r) => `<tr>${r.map((v) => `<td title="${esc(v)}">${esc(v)}</td>`).join("")}</tr>`).join("")}</tbody>
        </table>${(data.rows || []).length ? "" : `<div class="empty-note">${t("noneYet")}</div>`}</div>
        <div class="table-foot">
          <span>${t("rowsRange", fmtInt(from), fmtInt(to), fmtInt(data.total))}</span>
          <div class="pager">
            <button id="tb-prev" ${D.offset === 0 ? "disabled" : ""}>${t("prevPage")}</button>
            <button id="tb-next" ${to >= data.total ? "disabled" : ""} style="color:var(--accent)">${t("nextPage")}</button>
          </div>
        </div>
      </div>`;
    host.querySelectorAll("[data-col]").forEach((th) =>
      th.addEventListener("click", () => {
        const c = th.dataset.col;
        if (D.order === c) D.dir = D.dir === "asc" ? "desc" : "asc";
        else { D.order = c; D.dir = "asc"; }
        D.offset = 0; drawTableBrowser(host);
      }));
    $("tb-prev").addEventListener("click", () => { D.offset = Math.max(0, D.offset - 50); drawTableBrowser(host); });
    $("tb-next").addEventListener("click", () => { D.offset += 50; drawTableBrowser(host); });
    $("tb-csv").addEventListener("click", () => {
      const q = (v) => `"${String(v).replace(/"/g, '""')}"`;
      const csv = [(data.columns || []).map(q).join(","), ...(data.rows || []).map((r) => r.map(q).join(","))].join("\n");
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
      a.download = `${S.scope}-${D.table}.csv`;
      a.click();
      URL.revokeObjectURL(a.href);
    });
    const insertHost = $("tb-insert");
    const drawInsert = () => {
      insertHost.hidden = !D.insertOpen;
      $("tb-add").classList.toggle("on", D.insertOpen);
      if (!D.insertOpen) { insertHost.innerHTML = ""; return; }
      insertHost.innerHTML = `<div class="insert-grid">${(data.columns || []).map((c) =>
        `<span class="k">${esc(c)}</span><input class="txt-input" data-ic="${esc(c)}" placeholder="${esc(t("envValuePh"))}" style="height:34px">`).join("")}
        <span></span><button class="btn-primary" id="tb-save" style="height:36px;width:fit-content">${t("saveBtn")}</button></div>`;
      $("tb-save").addEventListener("click", async () => {
        const values = {};
        insertHost.querySelectorAll("[data-ic]").forEach((inp) => { if (inp.value !== "") values[inp.dataset.ic] = inp.value; });
        if (!Object.keys(values).length) return;
        $("tb-save").disabled = true;
        try {
          await api(`/api/v1/projects/${encodeURIComponent(S.scope)}/database/tables/${encodeURIComponent(D.table)}/rows`, jbody("POST", { values }));
          D.insertOpen = false; drawTableBrowser(host);
        } catch (e) { alert(t("wizFail", e.message)); $("tb-save").disabled = false; }
      });
    };
    $("tb-add").addEventListener("click", () => { D.insertOpen = !D.insertOpen; drawInsert(); });
    drawInsert();
  }

  function drawSqlEditor(host) {
    const D = S.db;
    host.innerHTML = `
      <div class="dcard">
        <div class="dcard-title">
          <input class="txt-input" id="sq-name" placeholder="${esc(t("queryNamePh"))}" value="${esc(D.qName)}" style="height:33px;font-family:'IBM Plex Sans',sans-serif;flex:1;max-width:280px">
          <div style="display:flex;align-items:center;gap:12px">
            <label class="write-toggle${D.write ? " write-on" : ""}" id="sq-wlabel"><input type="checkbox" id="sq-write" ${D.write ? "checked" : ""}>${t("writeMode")}</label>
            <button class="btn-sm" id="sq-save">${t("saveBtn")}</button>
            <button class="btn-primary" id="sq-run" style="height:33px;font-size:12.5px;border-radius:9px">${t("runBtn")} <span style="opacity:.7;font-family:var(--mono);font-size:11px">⌘↵</span></button>
          </div>
        </div>
        <textarea class="sql-box" id="sq-sql" spellcheck="false" placeholder="SELECT * FROM ...">${esc(D.sql)}</textarea>
      </div>
      <div class="dcard" id="sq-result" ${D.result ? "" : "hidden"}></div>`;
    const runQuery = async () => {
      D.sql = $("sq-sql").value;
      if (!D.sql.trim()) return;
      $("sq-run").disabled = true;
      try {
        const body = { sql: D.sql, write: D.write };
        if (D.qName.trim()) body.saved_name = D.qName.trim();
        D.result = await api(`/api/v1/projects/${encodeURIComponent(S.scope)}/database/query`, jbody("POST", body));
        D.resultError = null;
      } catch (e) { D.result = null; D.resultError = e.message; }
      $("sq-run").disabled = false;
      drawResult();
    };
    const drawResult = () => {
      const rHost = $("sq-result");
      if (D.resultError) {
        rHost.hidden = false;
        rHost.innerHTML = `<div class="warn-strip" style="margin:14px;border-color:var(--danger-line);background:var(--danger-soft);color:var(--danger)">${esc(D.resultError)}</div>`;
        return;
      }
      if (!D.result) { rHost.hidden = true; return; }
      rHost.hidden = false;
      const r = D.result;
      rHost.innerHTML = `
        <div class="dcard-title"><span class="label">${t("resultLbl")}</span>
          <span class="sub">${t("resultMeta", r.row_count)}${r.truncated ? ` · ${t("truncatedNote")}` : ""}</span></div>
        <div class="grid-wrap"><table class="data">
          <thead><tr>${(r.columns || []).map((c) => `<th>${esc(c)}</th>`).join("")}</tr></thead>
          <tbody>${(r.rows || []).map((row) => `<tr>${row.map((v) => `<td title="${esc(v)}">${esc(v)}</td>`).join("")}</tr>`).join("")}</tbody>
        </table>${(r.rows || []).length ? "" : `<div class="empty-note">${t("noneYet")}</div>`}</div>`;
    };
    $("sq-run").addEventListener("click", runQuery);
    $("sq-sql").addEventListener("keydown", (ev) => { if ((ev.metaKey || ev.ctrlKey) && ev.key === "Enter") runQuery(); });
    $("sq-write").addEventListener("change", () => {
      D.write = $("sq-write").checked;
      $("sq-wlabel").classList.toggle("write-on", D.write);
    });
    $("sq-name").addEventListener("input", () => { D.qName = $("sq-name").value; });
    $("sq-save").addEventListener("click", async () => {
      D.sql = $("sq-sql").value;
      const name = D.qName.trim();
      if (!name || !D.sql.trim()) return;
      try {
        await api(`/api/v1/projects/${encodeURIComponent(S.scope)}/database/queries`, jbody("PUT", { name, sql: D.sql }));
        const j = await api(`/api/v1/projects/${encodeURIComponent(S.scope)}/database/queries`);
        D.queries = j.queries || [];
        flashCopied($("sq-save"));
        render();
      } catch (e) { alert(t("wizFail", e.message)); }
    });
    drawResult();
  }

  async function drawBackups(host) {
    const D = S.db;
    host.innerHTML = `<div class="dcard"><div class="empty-note">${t("loading")}</div></div>`;
    try { D.backups = await api(`/api/v1/projects/${encodeURIComponent(S.scope)}/database/backups`); }
    catch (e) { host.innerHTML = `<div class="dcard"><div class="empty-note">${esc(e.message)}</div></div>`; return; }
    if (S.tab !== "db" || D.view !== "backups") return;
    const list = D.backups.backups || [];
    host.innerHTML = `
      <div class="dcard">
        <div class="dcard-title"><span class="label">${t("backupsTitle")}</span>
          <button class="btn-primary" id="bk-now" style="height:33px;font-size:12.5px;border-radius:9px">${t("backupNow")}</button></div>
        ${list.map((b) => `
          <div class="drow">
            <span class="mini-dot" style="background:var(--ok)"></span>
            <span style="flex:1;font-family:var(--mono);font-size:13px">${esc(b.file)}</span>
            <span class="cell-dim">${fmtBytes(b.size_bytes)}</span>
            <span class="sub" style="color:var(--ok)">${t("doneLbl")}</span>
            <a class="btn-sm" href="/api/v1/projects/${encodeURIComponent(S.scope)}/database/backups/${encodeURIComponent(b.file)}" download style="text-decoration:none">${t("downloadBtn")}</a>
            <button class="btn-sm" data-restore="${esc(b.file)}">${t("restoreBtn")}</button>
          </div>`).join("") || `<div class="empty-note">${t("noBackups")}</div>`}
      </div>`;
    $("bk-now").addEventListener("click", async () => {
      $("bk-now").disabled = true;
      try { await api(`/api/v1/projects/${encodeURIComponent(S.scope)}/database/backups`, { method: "POST" }); drawBackups(host); }
      catch (e) { alert(t("wizFail", e.message)); $("bk-now").disabled = false; }
    });
    host.querySelectorAll("[data-restore]").forEach((b) =>
      b.addEventListener("click", async () => {
        if (!confirm(t("restoreConfirm", b.dataset.restore))) return;
        b.disabled = true;
        try { await api(`/api/v1/projects/${encodeURIComponent(S.scope)}/database/backups/${encodeURIComponent(b.dataset.restore)}/restore`, { method: "POST" }); }
        catch (e) { alert(t("wizFail", e.message)); }
        b.disabled = false;
      }));
  }

  // ---------- project: errors ----------
  async function viewProjErrors() {
    const app = $("app");
    const E = S.errs;
    app.innerHTML = `<div id="er-head"></div><div class="dcard" id="er-card"><div class="empty-note">${t("loading")}</div></div>
      <div class="dcard" id="er-snippet" style="margin-top:16px"></div>`;
    if (!S.detail) await loadDetail();
    const fetchDraw = async () => {
      if (S.tab !== "errors") return;
      try { E.data = await api(`/api/v1/projects/${encodeURIComponent(S.scope)}/errors?state=${E.state}`); } catch { return; }
      if (S.tab !== "errors") return;
      $("er-head").innerHTML = projHeader();
      draw();
    };
    const bulk = async (action) => {
      if (!E.sel.length) return;
      if (action === "delete" && !confirm(t("deleteIssuesConfirm", E.sel.length))) return;
      try {
        await api(`/api/v1/projects/${encodeURIComponent(S.scope)}/errors/bulk`, jbody("POST", { ids: E.sel, action }));
        E.sel = []; fetchDraw();
      } catch (e) { alert(t("wizFail", e.message)); }
    };
    const draw = () => {
      const d = E.data || {};
      const issues = d.issues || [];
      const counts = d.counts || {};
      const winCut = nowSecs() - winMinutes() * 60;
      const eventsInWin = issues.reduce((a, i) => a + (i.recent_ts || []).filter((ts2) => S.win === "7d" || ts2 >= winCut).length, 0);
      const states = [["open", "stOpen"], ["resolved", "stResolved"], ["ignored", "stIgnored"]];
      const allSel = issues.length && E.sel.length === issues.length;
      $("er-card").innerHTML = `
        <div class="dcard-title">
          <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
            <span class="label">${t("groupedByCause")}</span>
            ${counts.open ? `<span class="err-badge">${t("openN", counts.open)}</span>` : ""}
            <span class="pill">${t("eventsInWindow", fmtInt(eventsInWin), winShort())}</span>
          </div>
          <div class="seg sm" id="er-states">${states.map(([k, lbl]) =>
            `<button class="seg-btn${E.state === k ? " on" : ""}" data-st="${k}">${t(lbl)}${counts[k] ? ` <span style="opacity:.75">${counts[k]}</span>` : ""}</button>`).join("")}</div>
        </div>
        <div class="bulk-bar${E.sel.length ? " active" : ""}">
          <button class="checkbox${allSel ? " on" : ""}" id="er-all" aria-label="select all">${allSel ? "✓" : E.sel.length ? "–" : ""}</button>
          ${E.sel.length ? `
            <b style="font-size:13px">${t("selectedN", E.sel.length)}</b>
            <div style="display:flex;gap:8px;margin-left:auto">
              ${E.state !== "resolved" ? `<button class="btn-sm" data-bulk="resolve">${t("actResolve")}</button>` : ""}
              ${E.state !== "ignored" ? `<button class="btn-sm" data-bulk="ignore">${t("actIgnore")}</button>` : ""}
              ${E.state !== "open" ? `<button class="btn-sm" data-bulk="open">${t("actReopen")}</button>` : ""}
              <button class="btn-danger sm" data-bulk="delete">${t("actDelete")}</button>
              <button class="btn-sm" id="er-clear" style="border:0;background:transparent">${t("clearSel")}</button>
            </div>` : `<span class="sub">${t("bulkHint")}</span>`}
        </div>
        ${issues.map((i) => {
          const sel = E.sel.includes(i.id);
          const open = E.open === i.id;
          const spark = sparkFromTs(i.recent_ts || [], i.first_seen);
          return `<div class="issue-block">
            <div class="issue-row" data-issue="${i.id}">
              <button class="checkbox${sel ? " on" : ""}" data-sel="${i.id}" aria-label="select">${sel ? "✓" : ""}</button>
              <div class="issue-main">
                <div class="issue-title">
                  <span class="mini-dot" style="background:${i.source === "browser" ? "var(--warn)" : "var(--accent)"}"></span>
                  <b>${esc(i.title)}</b>
                  <span class="role-badge" style="color:${i.source === "browser" ? "var(--warn)" : "var(--accent)"};background:${i.source === "browser" ? "var(--warn-soft)" : "var(--accent-soft)"}">${t(i.source === "browser" ? "srcBrowser" : "srcServer")}</span>
                </div>
                ${i.culprit ? `<div class="issue-culprit">${esc(i.culprit)}</div>` : ""}
              </div>
              <div class="col-events"><div class="res-sub">${t("eventsCol")}</div><div class="issue-count">${fmtInt(i.count)}</div></div>
              <div class="issue-sparkw col-spark">${spark}
                <div class="issue-last">${t("lastSeen")} ${t("agoW", relTime(nowSecs() - i.last_seen))}</div></div>
              <div style="text-align:right">
                ${i.state === "open" ? `<button class="btn-sm" data-one="resolve" data-id="${i.id}">${t("actResolve")}</button>` : `<button class="btn-sm" data-one="open" data-id="${i.id}">${t("actReopen")}</button>`}
              </div>
            </div>
            ${open ? `<div class="stack-box">
              <div class="stack-head"><span class="label">${t("stackTrace")}</span>
                <div style="display:flex;gap:8px">
                  <button class="btn-sm" data-copystack="${i.id}">${COPY_SVG}${t("copyAll")}</button>
                  ${E.state !== "ignored" ? `<button class="btn-sm" data-one="ignore" data-id="${i.id}">${t("actIgnore")}</button>` : ""}
                  <button class="btn-danger sm" data-one="delete" data-id="${i.id}">${t("actDelete")}</button>
                </div></div>
              <div class="stack-body" id="stack-${i.id}">${t("loading")}</div>
            </div>` : ""}
          </div>`;
        }).join("") || `<div class="empty-note">${t("errNone")}</div>`}`;
      $("er-snippet").innerHTML = `
        <div class="dcard-title"><span class="label">${t("errSnippet")}</span></div>
        <div style="padding:16px 20px;display:flex;flex-direction:column;gap:10px">
          <span class="sub">${t("errSnippetHelp")}</span>
          <div class="snippet-box">${esc(d.snippet || "")}</div>
          <button class="btn-sm" id="er-copy" style="width:fit-content">${t("copyBtn")}</button>
        </div>`;
      $("er-copy").addEventListener("click", async () => { if (await toClipboard(d.snippet || "")) flashCopied($("er-copy")); });
      $("er-states").querySelectorAll("[data-st]").forEach((b) =>
        b.addEventListener("click", () => { E.state = b.dataset.st; E.sel = []; E.open = null; fetchDraw(); }));
      $("er-all").addEventListener("click", () => { E.sel = allSel ? [] : issues.map((i) => i.id); draw(); });
      $("er-clear")?.addEventListener("click", () => { E.sel = []; draw(); });
      document.querySelectorAll("[data-bulk]").forEach((b) => b.addEventListener("click", () => bulk(b.dataset.bulk)));
      document.querySelectorAll("[data-sel]").forEach((b) =>
        b.addEventListener("click", (ev) => {
          ev.stopPropagation();
          const id = Number(b.dataset.sel);
          E.sel = E.sel.includes(id) ? E.sel.filter((x) => x !== id) : [...E.sel, id];
          draw();
        }));
      document.querySelectorAll("[data-one]").forEach((b) =>
        b.addEventListener("click", async (ev) => {
          ev.stopPropagation();
          const id = Number(b.dataset.id), action = b.dataset.one;
          if (action === "delete") {
            if (!confirm(t("deleteIssuesConfirm", 1))) return;
            await fetch(`/api/v1/projects/${encodeURIComponent(S.scope)}/errors/${id}`, { method: "DELETE" });
          } else {
            await api(`/api/v1/projects/${encodeURIComponent(S.scope)}/errors/${id}`, jbody("PUT", { state: action === "resolve" ? "resolved" : action }));
          }
          fetchDraw();
        }));
      document.querySelectorAll("[data-copystack]").forEach((b) =>
        b.addEventListener("click", async (ev) => {
          ev.stopPropagation();
          const txt = $(`stack-${b.dataset.copystack}`)?.textContent || "";
          if (await toClipboard(txt)) flashCopied(b);
        }));
      document.querySelectorAll(".issue-row").forEach((row) =>
        row.addEventListener("click", async () => {
          const id = Number(row.dataset.issue);
          E.open = E.open === id ? null : id;
          draw();
          if (E.open === id) {
            if (!E.events[id]) {
              try { E.events[id] = (await api(`/api/v1/projects/${encodeURIComponent(S.scope)}/errors/${id}`)).events || []; } catch { E.events[id] = []; }
            }
            const ev0 = E.events[id][0];
            const el = $(`stack-${id}`);
            if (el) el.textContent = ev0
              ? `${ev0.message}\n\n${t("firstSeen")} ${fmtClock(E.events[id][E.events[id].length - 1]?.ts || ev0.ts)} · ${esc(ev0.origin)}`
              : t("noStack");
          }
        }));
    };
    // occurrence timestamps -> 24-bucket sparkline
    function sparkFromTs(tsList, firstSeen) {
      const now = nowSecs();
      const from = Math.max(firstSeen, now - (S.win === "7d" ? 7 * 86400 : winMinutes() * 60));
      const span = Math.max(now - from, 3600);
      const buckets = new Array(24).fill(0);
      tsList.forEach((ts2) => {
        if (ts2 < from) return;
        buckets[Math.min(23, Math.floor(((ts2 - from) / span) * 24))] += 1;
      });
      const series = buckets.map((v, i) => ({ ts: from + (i * span) / 24, v }));
      return `${sparkSvg(series, { h: 22, stroke: "var(--danger)" })}<div class="lgd"><span>${t("agoW", relTime(now - from))}</span><span>${winShort()}</span></div>`;
    }
    await fetchDraw();
    every(fetchDraw, 20000);
  }

  // ---------- project: config ----------
  async function viewProjConfig() {
    const app = $("app");
    app.innerHTML = `<div id="cf-head"></div>
      <div class="detail-cols" id="cf-cols" style="grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);margin-top:0"></div>`;
    if (!S.detail) await loadDetail();
    const d = S.detail;
    if (!d) return;
    $("cf-head").innerHTML = projHeader();
    const cols = $("cf-cols");
    cols.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
        <div class="dcard" id="cf-domains"></div>
        <div class="dcard" id="cf-env"></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
        <div class="dcard" id="cf-versions"></div>
        ${S.scope !== "webo" ? `<div class="dcard danger-card" id="cf-danger"></div>` : ""}
      </div>`;
    drawDomains();
    drawEnv();
    drawVersions();
    if (S.scope !== "webo") drawDanger();

    function drawDomains() {
      const host = $("cf-domains");
      if (!d.domains_available && !d.auto_domain && !d.custom_domain) {
        host.innerHTML = `<div class="dcard-title"><span class="label">${t("domains")}</span></div><div class="empty-note">${t("domainsOff")}</div>`;
        return;
      }
      host.innerHTML = `
        <div class="dcard-title"><span class="label">${t("domains")}</span><span class="sub">${t("viaTunnel")}</span></div>
        ${d.auto_domain ? `<div class="drow">
          <span class="mini-dot" style="background:var(--ok)"></span>
          <div style="flex:1;min-width:0">
            <a class="url-link" href="https://${esc(d.auto_domain)}" target="_blank" rel="noopener">${esc(d.auto_domain)}</a>
            <div class="sub">${t("autoDomainNote")}</div>
          </div>
          <button class="btn-sm" id="dm-copy">${t("copyBtn")}</button>
        </div>` : ""}
        ${d.custom_domain ? `<div class="drow">
          <span class="mini-dot" style="background:var(--accent)"></span>
          <div style="flex:1;min-width:0">
            <a class="url-link" href="https://${esc(d.custom_domain)}" target="_blank" rel="noopener">${esc(d.custom_domain)}</a>
            ${d.tunnel_target ? `<div class="sub">${t("cnamePoint", esc(d.tunnel_target))}</div>` : ""}
          </div>
          <button class="btn-sm" id="dm-disc">${t("disconnectBtn")}</button>
        </div>` : `<div class="drow" style="gap:10px">
          <input class="txt-input" id="dm-input" placeholder="${esc(t("domPh"))}" style="flex:1">
          <button class="btn-primary" id="dm-conn" style="height:38px">${t("connectBtn")}</button>
        </div>
        <div style="padding:0 20px 14px"><span class="sub">${t("connectOwn")}</span></div>`}`;
      $("dm-copy")?.addEventListener("click", async () => { if (await toClipboard(d.auto_domain)) flashCopied($("dm-copy")); });
      $("dm-disc")?.addEventListener("click", async () => {
        await fetch(`/api/v1/projects/${encodeURIComponent(S.scope)}/domain`, { method: "DELETE" });
        S.detail = null; render();
      });
      $("dm-conn")?.addEventListener("click", async () => {
        const v = $("dm-input").value.trim();
        if (!v) return;
        $("dm-conn").disabled = true;
        try {
          const j = await api(`/api/v1/projects/${encodeURIComponent(S.scope)}/domain`, jbody("PUT", { domain: v }));
          if (j.dns_managed) alert(t("dnsReady")); else if (j.cname_target) alert(t("cnamePoint", j.cname_target));
          S.detail = null; render();
        } catch (e) { alert(t("wizFail", e.message)); $("dm-conn").disabled = false; }
      });
    }

    async function drawEnv() {
      const host = $("cf-env");
      host.innerHTML = `<div class="dcard-title"><span class="label">${t("variables")}</span></div><div class="empty-note">${t("loading")}</div>`;
      let env;
      try { env = await api(`/api/v1/projects/${encodeURIComponent(S.scope)}/env`); } catch { return; }
      if (S.tab !== "config") return;
      const vars = env.vars || [];
      const missing = env.missing || [];
      host.innerHTML = `
        <div class="dcard-title"><span class="label">${t("variables")}</span>
          <span class="sub">${t("definedN", vars.length)}${env.expected?.length ? ` · ${t("expectedByRepo", env.expected.length)}` : ""}</span></div>
        ${missing.map((k) => `<div class="kv-row"><span class="kv-key">${esc(k)}</span><span class="kv-val">—</span><span class="tag-missing">${t("missingVar")}</span></div>`).join("")}
        <div id="env-rows"></div>
        <div class="kv-row">
          <input class="txt-input" id="env-k" placeholder="${esc(t("keyPh"))}" style="text-transform:uppercase;height:34px">
          <input class="txt-input" id="env-v" placeholder="${esc(t("envValuePh"))}" style="height:34px">
          <button class="btn-primary" id="env-add" style="height:36px">${t("saveBtn")}</button>
        </div>
        <div style="padding:0 20px 14px"><span class="sub">${t("envRestartNote")}</span></div>`;
      const rowsHost = $("env-rows");
      const drawRows = () => {
        rowsHost.innerHTML = vars.map((v, i) => `
          <div class="kv-row">
            <span class="kv-key">${esc(v.key)}</span>
            <span class="kv-val" id="env-val-${i}">${esc(v.preview)}</span>
            <span class="kv-acts">
              ${v.managed ? `<span class="tag-managed">${t("managedTag")}</span>` : ""}
              <button class="mini-btn" data-reveal="${esc(v.key)}" data-i="${i}" title="${esc(t("reveal"))}">${EYE_SVG}</button>
              ${!v.managed ? `<button class="mini-btn" data-edit="${esc(v.key)}" title="${esc(t("editVar"))}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10-10-4-4L4 16v4Z"></path><path d="M14 6l4 4"></path></svg></button>
              <button class="mini-btn danger" data-del="${esc(v.key)}" title="${esc(t("removeVar"))}">×</button>` : ""}
            </span>
          </div>`).join("");
        rowsHost.querySelectorAll("[data-reveal]").forEach((b) =>
          b.addEventListener("click", async () => {
            try {
              const j = await api(`/api/v1/projects/${encodeURIComponent(S.scope)}/env/${encodeURIComponent(b.dataset.reveal)}`);
              const el = $(`env-val-${b.dataset.i}`);
              if (el.dataset.open === "1") { el.textContent = vars[Number(b.dataset.i)].preview; el.dataset.open = "0"; }
              else { el.textContent = j.value; el.dataset.open = "1"; }
            } catch {}
          }));
        rowsHost.querySelectorAll("[data-edit]").forEach((b) =>
          b.addEventListener("click", async () => {
            try {
              const j = await api(`/api/v1/projects/${encodeURIComponent(S.scope)}/env/${encodeURIComponent(b.dataset.edit)}`);
              $("env-k").value = b.dataset.edit;
              $("env-v").value = j.value;
              $("env-v").focus();
            } catch {}
          }));
        rowsHost.querySelectorAll("[data-del]").forEach((b) =>
          b.addEventListener("click", async () => {
            await fetch(`/api/v1/projects/${encodeURIComponent(S.scope)}/env?key=${encodeURIComponent(b.dataset.del)}`, { method: "DELETE" });
            drawEnv();
          }));
      };
      drawRows();
      $("env-add").addEventListener("click", async () => {
        const key = $("env-k").value.trim().toUpperCase(), value = $("env-v").value;
        if (!key) return;
        $("env-add").disabled = true;
        try {
          await api(`/api/v1/projects/${encodeURIComponent(S.scope)}/env`, jbody("PUT", { key, value }));
          drawEnv();
        } catch (e) { alert(t("wizFail", e.message)); $("env-add").disabled = false; }
      });
    }

    function drawVersions() {
      const host = $("cf-versions");
      host.innerHTML = `
        <div class="dcard-title"><span class="label">${t("versionsTitle")}</span><span class="sub">ghcr.io</span></div>
        ${(d.versions || []).map((v) => `
          <div class="drow">
            <span style="flex:1;font-family:var(--mono);font-size:12.5px">${esc(v.tag.slice(0, 9))}</span>
            <span class="sub">${t("agoW", relTime(nowSecs() - v.created_at))}</span>
            ${v.current ? `<span class="role-badge" style="color:var(--ok);background:var(--ok-soft)">${t("currentTag")}</span>` : `<span class="pill">${t("rollbackSoon")}</span>`}
          </div>`).join("") || `<div class="empty-note">${t("noneYet")}</div>`}`;
    }

    function drawDanger() {
      const host = $("cf-danger");
      host.innerHTML = `
        <div class="dcard-title"><span class="label" style="color:var(--danger)">${t("danger")}</span></div>
        <div style="padding:16px 20px;display:flex;flex-direction:column;gap:10px">
          <span class="sub">${t("delGithubNote")}</span>
          <button class="btn-danger" id="dz-del" style="width:fit-content">${t("delBtn")}</button>
        </div>`;
      $("dz-del").addEventListener("click", () => openDeleteModal(d));
    }
  }

  // ---------- delete modal ----------
  function openDeleteModal(d) {
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML = `
      <div class="modal-card">
        <div style="display:flex;flex-direction:column;gap:4px">
          <span style="font-size:17px;font-weight:700;color:var(--danger)">${t("delTitle", esc(d.name))}</span>
          <span class="sub">${t("delGithubNote")}</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px">
          <span class="label">${t("delWhat")}</span>
          <label class="check-row"><input type="checkbox" id="del-containers" checked><span>${t("delContainers")}</span></label>
          <label class="check-row"><input type="checkbox" id="del-volumes"><span style="color:var(--danger)">${t("delVolumes")}</span></label>
          <label class="check-row"><input type="checkbox" id="del-images"><span>${t("delImages")}</span></label>
          <span class="sub" id="del-warn" hidden>⚠ ${t("delRediscover")}</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <span class="sub">${t("delType", `<b style="font-family:var(--mono);color:var(--text)">${esc(d.slug)}</b>`)}</span>
          <input class="txt-input danger" id="del-name" autocomplete="off" spellcheck="false" style="width:100%;height:40px">
        </div>
        <span class="sub" id="del-error" style="color:var(--danger)" hidden></span>
        <div style="display:flex;gap:10px;justify-content:flex-end">
          <button class="btn-ghost" id="del-cancel">${t("delCancel")}</button>
          <button class="btn-danger solid" id="del-go" disabled>${t("delConfirm")}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const q = (id) => overlay.querySelector("#" + id);
    const syncWarn = () => { q("del-warn").hidden = q("del-containers").checked || !d.running; };
    syncWarn();
    q("del-containers").addEventListener("change", syncWarn);
    q("del-name").addEventListener("input", () => { q("del-go").disabled = q("del-name").value.trim() !== d.slug; });
    const close = () => overlay.remove();
    q("del-cancel").addEventListener("click", close);
    overlay.addEventListener("click", (ev) => { if (ev.target === overlay) close(); });
    q("del-go").addEventListener("click", async () => {
      q("del-go").disabled = true;
      try {
        await api(`/api/v1/projects/${encodeURIComponent(d.slug)}`, jbody("DELETE", {
          containers: q("del-containers").checked,
          volumes: q("del-volumes").checked,
          images: q("del-images").checked,
        }));
        close();
        S.scope = "server"; S.tab = "projects";
        await loadProjects();
        render();
      } catch (e) {
        q("del-error").hidden = false;
        q("del-error").textContent = t("wizFail", e.message);
        q("del-go").disabled = false;
      }
    });
  }

  // ---------- render dispatch ----------
  async function render() {
    clearTimers();
    S.scopeOpen = false;
    renderScope();
    renderTabs();
    const app = $("app");
    app.innerHTML = "";
    if (S.scope === "server") {
      if (S.tab === "overview") await viewOverview();
      else if (S.tab === "processes") await viewProcesses();
      else if (S.tab === "projects") await viewProjects();
      else if (S.tab === "wizard") await viewWizard();
      else { S.tab = "overview"; await viewOverview(); }
    } else {
      if (!projectBySlug(S.scope) && S.projects.length) { S.scope = "server"; S.tab = "projects"; return render(); }
      if (S.tab === "general") await viewProjGeneral();
      else if (S.tab === "logs") await viewProjLogs();
      else if (S.tab === "db") await viewProjDb();
      else if (S.tab === "errors") await viewProjErrors();
      else if (S.tab === "config") await viewProjConfig();
      else { S.tab = "general"; await viewProjGeneral(); }
    }
    renderScope();
    renderTabs();
  }

  // ---------- boot ----------
  (async () => {
    document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
    try {
      const [sys, snap] = await Promise.all([api("/api/v1/system"), api("/api/v1/snapshot")]);
      S.system = sys; S.snapshot = snap;
      renderUpChip();
    } catch {}
    await loadProjects();
    setInterval(loadProjects, 30000); // survives render(): it feeds the scope menu everywhere
    render();
  })();
})();
</script>
</body>
</html>
