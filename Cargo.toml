[package]
name = "webo"
version = "0.1.0"
edition = "2021"
description = "Painel de saúde de servidor — CPU, RAM, disco, temperatura, rede — leve e self-hosted."
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
bollard = "0.18"

[profile.release]
strip = true
lto = "thin"
