# webo — run with: docker compose -f deploy/docker-compose.yml up -d --build
# Panel at http://<server>:5050
name: webo
services:
  webo:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "5050:5050"
    pid: host                # host processes and CPU/memory, not the container's
    restart: unless-stopped
    environment:
      - WEBO_NET_DEV=/host/proc_net_dev
      - WEBO_DB_PATH=/data/webo.db
    volumes:
      - webo-data:/data                                # project metadata (SQLite)
      - webo-backups:/backups                          # database dumps (shared with the pg_dump helpers)
      - /var/run/docker.sock:/var/run/docker.sock:ro   # project discovery + container metrics (optional)
      # Bind-mounting /proc/net/dev gives the CONTAINER's network namespace —
      # webo saw its own lo and eth0 and reported those as the machine's
      # traffic. /proc/1/net/dev is the host's init process, so it carries the
      # host's interfaces; mounting /proc is what makes that path reachable.
      - /proc:/host/proc:ro                            # host network rates (optional)
      - /sys:/sys:ro                                   # temperature and battery (optional)
      - /etc/hostname:/host/etc/hostname:ro            # real host name (optional)
      - /etc/os-release:/host/etc/os-release:ro        # real host OS (optional)

volumes:
  webo-data:
  webo-backups:
    # fixed name: the short-lived pg_dump/pg_restore helper containers bind
    # the same volume by name, outside compose
    name: webo-backups
