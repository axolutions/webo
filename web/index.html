<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>webo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --accent: #4f8bff;
    --accent-2: #7c5cff;
    --page:
      radial-gradient(1200px 700px at 12% -10%, #10254f 0%, rgba(16, 37, 79, 0) 60%),
      radial-gradient(900px 600px at 92% 8%, #123a6b 0%, rgba(18, 58, 107, 0) 55%),
      linear-gradient(180deg, #05080f 0%, #060c1a 45%, #081431 100%);
    --surface: rgba(255, 255, 255, 0.045);
    --surface-2: rgba(255, 255, 255, 0.075);
    --surface-3: rgba(255, 255, 255, 0.11);
    --card: linear-gradient(180deg, rgba(255, 255, 255, 0.062), rgba(255, 255, 255, 0.028));
    --stroke: rgba(255, 255, 255, 0.085);
    --stroke-strong: rgba(255, 255, 255, 0.2);
    --text: #eaf0fd;
    --text-2: #a2b4d4;
    --text-3: #6f83a5;
    --accent-soft: rgba(79, 139, 255, 0.16);
    --sh: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 10px 24px -14px rgba(0, 0, 0, 0.7);
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --ok: #3fca7c;
    --ok-soft: rgba(63, 202, 124, 0.14);
    --danger: #e5484d;
    --danger-soft: rgba(229, 72, 77, 0.14);
    --danger-line: rgba(229, 72, 77, 0.35);
    --warn: #eab308;
    --warn-soft: rgba(234, 179, 8, 0.12);
    --code: rgba(0, 0, 0, 0.25);
    --spark-ring: #0a1226;
  }
  [data-theme="light"] {
    --page:
      radial-gradient(1000px 600px at 8% -10%, #dfe9ff 0%, rgba(223, 233, 255, 0) 60%),
      radial-gradient(900px 600px at 95% 0%, #e6f0ff 0%, rgba(230, 240, 255, 0) 55%),
      linear-gradient(180deg, #f4f7fd 0%, #eaf0fa 100%);
    --surface: rgba(255, 255, 255, 0.62);
    --surface-2: rgba(255, 255, 255, 0.82);
    --surface-3: rgba(15, 32, 68, 0.06);
    --card: linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.72));
    --stroke: rgba(15, 32, 68, 0.09);
    --stroke-strong: rgba(15, 32, 68, 0.2);
    --text: #0f1c33;
    --text-2: #4c6183;
    --text-3: #7c8dab;
    --accent-soft: rgba(31, 107, 255, 0.12);
    --sh: 0 1px 2px rgba(20, 40, 80, 0.06), 0 8px 20px -14px rgba(20, 40, 80, 0.35);
    --code: rgba(15, 32, 68, 0.05);
    --spark-ring: #eef3fc;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; min-height: 100vh; background: var(--page); color: var(--text);
    font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  ::selection { background: rgba(79, 139, 255, 0.3); }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 22px 24px 40px; }

  /* ---------- header + scope ---------- */
  header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-icon {
    display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px;
    background: linear-gradient(150deg, var(--accent), var(--accent-2));
    box-shadow: 0 10px 22px -12px var(--accent);
  }
  .brand-name { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; }
  .brand-sep { font-size: 20px; color: var(--text-3); font-weight: 300; }
  .scope-host { position: relative; }
  .scope-btn {
    display: flex; align-items: center; gap: 9px; height: 40px; padding: 0 13px;
    border: 1px solid var(--stroke); border-radius: 11px; background: var(--card);
    color: var(--text); font: 600 14px "IBM Plex Sans", sans-serif; cursor: pointer; box-shadow: var(--sh);
  }
  .scope-btn:hover { border-color: var(--stroke-strong); }
  .scope-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .scope-caret { color: var(--text-3); font-size: 10px; }
  .tech-chip {
    display: grid; place-items: center; width: 22px; height: 22px; border-radius: 7px;
    font: 700 10.5px var(--mono); flex: none;
  }
  .scope-menu {
    position: absolute; top: calc(100% + 8px); left: 0; width: 330px; z-index: 40;
    background: var(--card); border: 1px solid var(--stroke-strong); border-radius: 14px;
    box-shadow: 0 24px 48px -20px rgba(0, 0, 0, 0.75); backdrop-filter: blur(18px); overflow: hidden;
  }
  .scope-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 14px; cursor: pointer; font-size: 13.5px;
  }
  .scope-row:hover, .scope-row.on { background: var(--surface); }
  .scope-row .left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .scope-row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .scope-row .right { font-size: 11.5px; color: var(--text-3); flex: none; }
  .scope-head { padding: 12px 14px; border-bottom: 1px solid var(--stroke); font-weight: 600; }
  .scope-label { padding: 9px 14px 5px; font-size: 10.5px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-3); }
  .scope-new { padding: 12px 14px; border-top: 1px solid var(--stroke); font-weight: 600; color: var(--accent); cursor: pointer; font-size: 13.5px; }
  .scope-new:hover { background: var(--surface); }
  .chips { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .chip {
    display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 13px;
    border: 1px solid var(--stroke); border-radius: 10px; background: var(--card);
    color: var(--text-2); font-size: 12.5px; white-space: nowrap; box-shadow: var(--sh);
  }
  .dot { width: 7px; height: 7px; border-radius: 999px; background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); flex: none; }
  .dot.off { background: var(--danger); box-shadow: none; }
  .mini-dot { width: 6px; height: 6px; border-radius: 999px; flex: none; }
  .icon-btn {
    display: grid; place-items: center; width: 38px; height: 38px; border: 1px solid var(--stroke);
    border-radius: 11px; background: var(--card); color: var(--text-2); cursor: pointer; padding: 0; box-shadow: var(--sh);
  }
  .icon-btn:hover { color: var(--text); border-color: var(--stroke-strong); }
  .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- nav + window ---------- */
  .nav-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
  .seg { display: flex; gap: 3px; padding: 4px; border-radius: 13px; background: var(--surface-3); width: fit-content; }
  .seg-btn {
    height: 34px; padding: 0 15px; border: 0; border-radius: 10px; background: transparent;
    color: var(--text-2); font-weight: 600; font-size: 13.5px; white-space: nowrap; font-family: inherit; cursor: pointer;
    display: flex; align-items: center; gap: 7px;
  }
  .seg-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .seg-btn.on { background: linear-gradient(150deg, var(--accent), var(--accent-2)); color: #fff; box-shadow: 0 8px 18px -10px var(--accent); }
  .seg.sm { padding: 3px; border-radius: 11px; }
  .seg.sm .seg-btn { height: 29px; padding: 0 12px; font-size: 12.5px; border-radius: 8px; }
  .win-row { display: flex; align-items: center; gap: 12px; }
  .win-note { font-size: 12px; color: var(--text-3); }

  /* ---------- cards ---------- */
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  .stat-card, .dcard {
    display: flex; flex-direction: column; border-radius: 16px;
    background: var(--card); border: 1px solid var(--stroke); box-shadow: var(--sh);
    backdrop-filter: blur(14px); min-width: 0;
  }
  .stat-card { gap: 12px; padding: 20px 22px; }
  .dcard { overflow: hidden; }
  .dcard-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--stroke); flex-wrap: wrap; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .label { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-3); }
  .mono-badge {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.02em; color: var(--text-3);
    padding: 3px 8px; border-radius: 7px; background: var(--surface-3); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; max-width: 60%;
  }
  .hero-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
  .hero-num { display: flex; align-items: baseline; gap: 5px; }
  .hero { font-size: 38px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums; }
  .hero-unit { font-size: 15px; font-weight: 600; color: var(--text-3); }
  .hero-side { font-size: 12.5px; color: var(--text-2); text-align: right; }
  .hero-side b { font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
  .sub { font-size: 12px; color: var(--text-3); }
  .bar-track { height: 8px; border-radius: 999px; background: var(--surface-3); overflow: hidden; position: relative; }
  .bar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width 0.4s ease; }
  .bar-fill.plain { background: var(--text-2); opacity: 0.55; }
  .bar-cap { position: absolute; top: -2px; width: 2px; height: 12px; border-radius: 2px; background: var(--danger-line); }
  .row-between { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .status-ok { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ok); }
  .status-hot { color: var(--danger); }
  .status-warm { color: var(--warn); }
  .kv { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .kv .v { font-size: 13.5px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
  .kv .v.mono { font-family: var(--mono); font-weight: 500; font-size: 12.5px; }
  .sys-strip { flex-direction: row; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 18px; padding: 18px 24px; }
  .totals-strip { display: flex; align-items: center; gap: 0; flex-wrap: wrap; padding: 18px 22px; }
  .total-cell { display: flex; flex-direction: column; gap: 4px; padding: 0 22px; border-left: 1px solid var(--stroke); min-width: 0; }
  .total-cell:first-child { padding-left: 0; border-left: 0; }
  .total-cell .n { display: flex; align-items: center; gap: 7px; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .spark { display: block; width: 100%; height: 44px; }
  .spark-host { position: relative; }
  .spark-host svg { display: block; cursor: crosshair; }
  .spark-tip {
    position: absolute; pointer-events: none; z-index: 6; transform: translate(-50%, -120%);
    background: var(--surface-2); border: 1px solid var(--stroke-strong); border-radius: 9px;
    padding: 5px 9px; font-size: 11.5px; white-space: nowrap; color: var(--text);
    box-shadow: 0 10px 24px -14px rgba(0, 0, 0, 0.9); backdrop-filter: blur(10px);
  }
  .spark-cursor { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--stroke-strong); pointer-events: none; }
  .net-heroes { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; }
  .net-item { display: flex; align-items: baseline; gap: 5px; font-size: 13px; color: var(--text-3); }
  .net-item b { font-size: 26px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }

  /* ---------- buttons, badges, inputs ---------- */
  .btn-primary {
    display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border: 0; border-radius: 11px;
    background: linear-gradient(150deg, var(--accent), var(--accent-2)); color: #fff; font-weight: 600;
    font-size: 13.5px; white-space: nowrap; font-family: inherit; cursor: pointer; box-shadow: 0 10px 22px -12px var(--accent);
  }
  .btn-primary:disabled { opacity: 0.4; box-shadow: none; cursor: default; }
  .btn-primary:focus-visible, .btn-ghost:focus-visible, .btn-sm:focus-visible, .btn-danger:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-ghost {
    display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border: 1px solid var(--stroke);
    border-radius: 11px; background: var(--surface-2); color: var(--text-2); font-weight: 600; font-size: 13.5px;
    font-family: inherit; cursor: pointer;
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--stroke-strong); }
  .btn-sm {
    height: 31px; padding: 0 12px; border: 1px solid var(--stroke); border-radius: 9px; background: var(--surface-2);
    color: var(--text-2); font-weight: 600; font-size: 12.5px; font-family: inherit; cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
  }
  .btn-sm:hover { color: var(--text); border-color: var(--stroke-strong); }
  .btn-sm.on { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .btn-danger {
    display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border: 1px solid var(--danger-line);
    border-radius: 11px; background: var(--danger-soft); color: var(--danger); font-weight: 600; font-size: 13.5px;
    font-family: inherit; cursor: pointer;
  }
  .btn-danger:hover { background: rgba(229, 72, 77, 0.22); }
  .btn-danger.solid { background: var(--danger); color: #fff; border-color: transparent; justify-content: center; }
  .btn-danger:disabled { opacity: 0.4; cursor: default; }
  .btn-danger.sm { height: 31px; padding: 0 12px; font-size: 12.5px; border-radius: 9px; }
  .pill { font-size: 10.5px; font-weight: 600; color: var(--text-2); padding: 1px 8px; border-radius: 999px; background: var(--surface-3); white-space: nowrap; }
  .role-badge { font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .err-badge { font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; color: var(--danger); background: var(--danger-soft); }
  .tag-managed { font-size: 10.5px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
  .tag-missing { font-size: 10.5px; font-weight: 600; color: var(--danger); background: var(--danger-soft); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
  .search-box {
    display: flex; align-items: center; gap: 9px; height: 38px; padding: 0 12px;
    border: 1px solid var(--stroke); border-radius: 11px; background: var(--surface-2); min-width: 0;
  }
  .search-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .search-box svg { color: var(--text-3); flex: none; }
  .search-box input { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 13.5px; color: var(--text); outline: none; }
  .search-box input::placeholder { color: var(--text-3); }
  .txt-input {
    height: 38px; padding: 0 12px; border: 1px solid var(--stroke); border-radius: 10px; background: var(--surface-2);
    font-family: var(--mono); font-size: 13px; color: var(--text); outline: none; min-width: 0;
  }
  .txt-input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .txt-input.danger:focus { border-color: var(--danger); box-shadow: 0 0 0 4px var(--danger-soft); }

  /* ---------- processes ---------- */
  .proc-grid { display: grid; grid-template-columns: minmax(0, 2.4fr) minmax(0, 1.4fr) minmax(0, 1.2fr) 92px 76px; gap: 15px; align-items: center; padding: 13px 20px; }
  .proc-grid.head { padding: 9px 20px; border-bottom: 1px solid var(--stroke); background: var(--surface); }
  .proc-row { border-top: 1px solid var(--stroke); }
  .proc-row:first-of-type { border-top: 0; }
  .proc-row.expandable { cursor: pointer; }
  .proc-row.expandable:hover { background: var(--surface); }
  .head-lbl { font-size: 10.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-3); }
  .sort-btn { display: flex; align-items: center; gap: 5px; border: 0; background: transparent; padding: 0; font-family: inherit; cursor: pointer; text-align: left; font-size: 10.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-3); }
  .sort-btn:hover { color: var(--text-2); }
  .sort-btn.on { color: var(--accent); }
  .sort-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .proc-id { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .chev { transition: transform 0.15s ease; color: var(--text-3); flex: none; width: 12px; font-size: 10px; }
  .open > .proc-grid .chev, .chev.open { transform: rotate(90deg); }
  .proc-names { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .proc-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .proc-title .n { font-weight: 600; }
  .proc-cmd { font-family: var(--mono); font-size: 11px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cell-meter { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .cell-meter b { font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; width: 52px; flex: none; }
  .mini-track { flex: 1; height: 4px; border-radius: 999px; background: var(--surface-3); overflow: hidden; min-width: 20px; }
  .mini-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
  .mini-fill.warm { background: var(--warn); }
  .mini-fill.plain { background: var(--text-2); opacity: 0.5; }
  .cell-dim { font-size: 12.5px; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .cell-dim.right { text-align: right; }
  .child-rows { border-top: 1px solid var(--stroke); background: var(--surface); padding: 4px 0; }
  .child-row { display: grid; grid-template-columns: minmax(0, 2.4fr) minmax(0, 1.4fr) minmax(0, 1.2fr) 92px 76px; gap: 15px; align-items: center; padding: 7px 20px 7px 51px; }
  .child-row .n { font-size: 13px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .child-row .pid { font-family: var(--mono); font-size: 10.5px; color: var(--text-3); }
  .proc-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 20px; border-top: 1px solid var(--stroke); font-size: 12px; color: var(--text-3); flex-wrap: wrap; }

  /* ---------- project cards ---------- */
  .proj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 16px; }
  .proj-card {
    display: flex; flex-direction: column; gap: 13px; padding: 20px; border-radius: 16px;
    background: var(--card); border: 1px solid var(--stroke); box-shadow: var(--sh);
    backdrop-filter: blur(14px); cursor: pointer; min-width: 0;
    transition: transform 0.16s cubic-bezier(0.2, 0.8, 0.25, 1), border-color 0.16s;
  }
  .proj-card:hover { transform: translateY(-2px); border-color: var(--stroke-strong); }
  .proj-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .proj-idw { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .proj-icon { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 11px; flex: none; font: 700 13px var(--mono); }
  .proj-nm { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .proj-nm b { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .proj-dom { font-family: var(--mono); font-size: 11px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .proj-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding-top: 12px; border-top: 1px solid var(--stroke); }
  .proj-stats .v { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .deploy-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--text-3); flex-wrap: wrap; }
  .empty-note { padding: 24px 20px; font-size: 13px; color: var(--text-3); text-align: center; }
  .warn-strip { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(234, 179, 8, 0.35); background: var(--warn-soft); font-size: 12.5px; color: var(--text-2); }

  /* ---------- project detail: kpis + resources ---------- */
  .kpi-card { display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: var(--card); border: 1px solid var(--stroke); box-shadow: var(--sh); backdrop-filter: blur(14px); min-width: 0; }
  .kpi-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .kpi-num { display: flex; align-items: baseline; gap: 4px; margin-top: 2px; }
  .kpi-num b { font-size: 25px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }

    rust: ["Rs", "rgba(249,115,22,.16)", "#f6902c"],
    ruby: ["Ru", "rgba(229,72,77,.16)", "#f2707c"],
    next: ["N", "rgba(255,255,255,.14)", "var(--text)"],
    node: ["Js", "rgba(234,179,8,.16)", "#eab308"],
    postgres: ["Pg", "rgba(56,189,248,.16)", "#4fc3f7"],
    redis: ["Rd", "rgba(229,72,77,.16)", "#f2707c"],
    mysql: ["My", "rgba(56,189,248,.16)", "#4fc3f7"],
    cloudflare: ["CF", "rgba(249,115,22,.16)", "#f6902c"],
    web: ["W", "rgba(63,202,124,.16)", "#3fca7c"],
    go: ["Go", "rgba(56,189,248,.16)", "#4fc3f7"],
    python: ["Py", "rgba(56,189,248,.16)", "#4fc3f7"],
  };
  const techOf = (tech, name) => {
    const k = TECH[tech];
    if (k) return k;
    const initial = (name || "?").charAt(0).toUpperCase();
    return [initial, "var(--surface-3)", "var(--text-2)"];
  };
  const techChip = (tech, name, size = 22) =>
    `<span class="tech-chip" style="width:${size}px;height:${size}px;background:${techOf(tech, name)[1]};color:${techOf(tech, name)[2]}">${esc(techOf(tech, name)[0])}</span>`;
  const roleColors = { app: "#4f8bff", database: "#38bdf8", banco: "#38bdf8" };
  const roleBadge = (role) => {
    const c = roleColors[role] || "#7c5cff";
    const label = role === "database" ? (LANG === "pt" ? "banco" : "database") : esc(role);
    return `<span class="role-badge" style="color:${c};background:${c}24">${label}</span>`;
  };
  const LVL_COLOR = { info: "var(--text-3)", warn: "var(--warn)", error: "var(--danger)" };

  // ---------- interactive sparkline ----------
  // series: [{ts, v}]; fmt(v) label; windowed=min-max scaling
  function sparkSvg(series, opts = {}) {
    const { h = 44, stroke = "var(--accent)", max = null, windowed = false, fill = false } = opts;
    if (!series || series.length < 2) return `<svg class="spark" viewBox="0 0 100 30" preserveAspectRatio="none"></svg>`;
    const vals = series.map((s) => s.v);
    let lo = windowed ? Math.min(...vals) : 0;
    let hi = max ?? Math.max(...vals);
    if (windowed) { const pad = (hi - lo) * 0.15 || hi * 0.05 || 1; lo = Math.max(0, lo - pad); hi = hi + pad; }
    if (hi <= lo) hi = lo + 1;
    const pts = series.map((s, i) => `${(i / (series.length - 1) * 100).toFixed(2)},${(28 - ((s.v - lo) / (hi - lo)) * 26).toFixed(2)}`);
    const area = fill ? `<polygon points="0,30 ${pts.join(" ")} 100,30" fill="${stroke}" opacity="0.09"></polygon>` : "";
    return `<svg class="spark" style="height:${h}px" viewBox="0 0 100 30" preserveAspectRatio="none">${area}<polyline fill="none" stroke="${stroke}" stroke-width="1.2" vector-effect="non-scaling-stroke" points="${pts.join(" ")}"></polyline></svg>`;
  }
  function wireSpark(host, series, fmt) {
    if (!host || !series || series.length < 2) return;
    host.classList.add("spark-host");
    let tip = null, cur = null;
    const move = (ev) => {
      const rect = host.getBoundingClientRect();
      const x = Math.min(Math.max(ev.clientX - rect.left, 0), rect.width);
      const idx = Math.min(series.length - 1, Math.round((x / rect.width) * (series.length - 1)));
      const s = series[idx];
      if (!tip) {
        tip = document.createElement("div"); tip.className = "spark-tip"; host.appendChild(tip);
        cur = document.createElement("div"); cur.className = "spark-cursor"; host.appendChild(cur);
      }
      tip.textContent = `${fmt(s.v)} · ${new Date(s.ts * 1000).toLocaleString(LOCALE, { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}`;
      tip.style.left = `${x}px`; tip.style.top = "8px";
      cur.style.left = `${x}px`;
    };
    const leave = () => { tip?.remove(); cur?.remove(); tip = cur = null; };
    host.addEventListener("mousemove", move);
    host.addEventListener("mouseleave", leave);
  }
  function drawSpark(id, series, fmt, opts) {
    const host = $(id);
    if (!host) return;
    host.innerHTML = sparkSvg(series, opts);
    wireSpark(host, series, fmt);
  }
  const seriesOf = (hist, key, tsKey = "ts") => (hist || []).map((s) => ({ ts: s[tsKey], v: Number(s[key]) || 0 }));

  // ---------- theme ----------
  const root = document.documentElement;
  const applyTheme = (th) => { if (th === "light") root.dataset.theme = "light"; else delete root.dataset.theme; };
  let theme = null;
  try { theme = localStorage.getItem("webo-theme"); } catch {}
  if (!theme) theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";

  $("theme-btn").addEventListener("click", () => {

  // ---------- global state ----------

    projects: [],            // /api/v1/projects cache
    snapshot: null, system: null, docker: null,
    procSort: "cpu", procQuery: "", procOpen: null,
    detail: null,            // /projects/{slug} cache
    proj7d: null,

    db: { view: "tables", tables: [], table: null, rows: null, offset: 0, order: null, dir: "asc",

    wiz: null,

  const winMinutes = () => (S.win === "rt" ? 15 : S.win === "24h" ? 1440 : 10080);
  const winShort = () => t(S.win === "rt" ? "winShortRt" : S.win === "24h" ? "winShort24" : "winShort7");
  const clearTimers = () => { S.timers.forEach(clearInterval); S.timers = []; };
  const every = (fn, ms) => { S.timers.push(setInterval(fn, ms)); };

  const COPY_SVG = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M15 5.5A1.5 1.5 0 0 0 13.5 4H6a2 2 0 0 0-2 2v7.5A1.5 1.5 0 0 0 5.5 15"></path></svg>`;
  const EYE_SVG = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.6"></circle></svg>`;
  const SEARCH_SVG = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>`;

  // ---------- scope switcher + tabs + window ----------

    }).join("");
    $("tabs").querySelectorAll("[data-tab]").forEach((b) =>
      b.addEventListener("click", () => { S.tab = b.dataset.tab; render(); }));
    const wins = [["rt", "winRt"], ["24h", "win24"], ["7d", "win7"]];
    $("win-seg").innerHTML = wins.map(([k, lbl]) =>
      `<button class="seg-btn${S.win === k ? " on" : ""}" data-win="${k}">${k === "rt" ? `<span class="mini-dot" style="background:${S.win === "rt" ? "#fff" : "var(--ok)"}"></span>` : ""}${t(lbl)}</button>`).join("");

  // ---------- server: overview ----------
  async function loadServerHistory() {

  async function viewOverview() {

  // ---------- server: processes ----------
  async function viewProcesses() {
    const app = $("app");
    app.innerHTML = `
      <div class="stat-card totals-strip" id="pr-totals" style="flex-direction:row"></div>
      <div class="dcard" style="margin-top:16px">

    $("pr-q").addEventListener("input", debounce(() => { S.procQuery = $("pr-q").value; drawRows(); }, 150));
    const sorts = [["cpu", "sortCpu"], ["mem", "sortMem"], ["name", "sortName"]];
    const drawSort = () => {
      $("pr-sort").innerHTML = sorts.map(([k, lbl]) => `<button class="seg-btn${S.procSort === k ? " on" : ""}" data-s="${k}">${t(lbl)}</button>`).join("");

    };
    drawSort();
    let data = { processes: [], total: 0 };
    const drawRows = () => {
      if (S.tab !== "processes") return;
      let list = [...data.processes];
      const q = S.procQuery.trim().toLowerCase();
      if (q) list = list.filter((p) => p.name.toLowerCase().includes(q) || p.cmd.toLowerCase().includes(q) || String(p.pid).includes(q) || p.children.some((c) => String(c.pid).includes(q) || c.name.toLowerCase().includes(q)));
      if (S.procSort === "mem") list.sort((a, b) => b.mem_bytes - a.mem_bytes);
      else if (S.procSort === "name") list.sort((a, b) => a.name.localeCompare(b.name));
      else list.sort((a, b) => b.cpu_pct - a.cpu_pct);
      const cpuMax = Math.max(...list.map((p) => p.cpu_pct), 10);
      const memMax = Math.max(...list.map((p) => p.mem_bytes), 1);
      $("pr-rows").innerHTML = list.map((p) => {
        const open = S.procOpen === p.pid;
        const kids = open ? `<div class="child-rows">${p.children.map((c) => `
          <div class="child-row">
            <span class="proc-id" style="gap:9px"><span style="width:8px;height:1px;background:var(--stroke);flex:none"></span>
              <span class="n">${esc(c.name)}</span><span class="pid">${t("pid")} ${c.pid}</span></span>
            <span class="cell-dim">${fmtNum(c.cpu_pct)}%</span>
            <span class="cell-dim col-mem">${fmtBytes(c.mem_bytes)}</span>
            <span class="cell-dim col-disk">${c.disk_bps ? fmtBps(c.disk_bps) : "—"}</span>
            <span class="cell-dim col-thr right">${c.threads}</span>
          </div>`).join("")}</div>` : "";
        return `<div class="proc-row${p.children.length ? " expandable" : ""}${open ? " open" : ""}" data-pid="${p.pid}">
          <div class="proc-grid">
            <div class="proc-id">
              <span class="chev${open ? " open" : ""}">${p.children.length ? "›" : ""}</span>
              <div class="proc-names">
                <div class="proc-title"><span class="n">${esc(p.name)}</span>${p.procs > 1 ? `<span class="pill">${t("nProcs", p.procs)}</span>` : ""}</div>
                <span class="proc-cmd">${esc(p.cmd)}</span>
              </div>
            </div>
            <div class="cell-meter"><b>${fmtNum(p.cpu_pct)}%</b><div class="mini-track"><div class="mini-fill${p.cpu_pct > cpuMax * 0.6 ? " warm" : ""}" style="width:${Math.min(100, (p.cpu_pct / cpuMax) * 100).toFixed(0)}%"></div></div></div>
            <div class="cell-meter col-mem"><b>${fmtBytes(p.mem_bytes)}</b><div class="mini-track"><div class="mini-fill plain" style="width:${Math.min(100, (p.mem_bytes / memMax) * 100).toFixed(0)}%"></div></div></div>
            <span class="cell-dim col-disk">${p.disk_bps ? fmtBps(p.disk_bps) : "—"}</span>
            <span class="cell-dim col-thr right">${p.threads}</span>
          </div>${kids}</div>`;
      }).join("") || `<div class="empty-note">${t("logsEmpty")}</div>`;
      $("pr-rows").querySelectorAll(".proc-row.expandable").forEach((row) =>
        row.addEventListener("click", () => {
          const pid = Number(row.dataset.pid);
          S.procOpen = S.procOpen === pid ? null : pid;
          drawRows();
        }));
      $("pr-foot").textContent = t("procFoot", list.length);
      const cpuSum = data.processes.reduce((a, p) => a + p.cpu_pct, 0);
      const memSum = data.processes.reduce((a, p) => a + p.mem_bytes, 0);
      const diskSum = data.processes.reduce((a, p) => a + p.disk_bps, 0);
      $("pr-totals").innerHTML = `
        <div class="total-cell"><span class="sub" style="text-transform:uppercase;letter-spacing:.06em">${t("procTotal")}</span><span class="n">${data.total ?? "—"}</span></div>
        <div class="total-cell"><span class="sub" style="text-transform:uppercase;letter-spacing:.06em">${t("procGroups")}</span><span class="n">${data.processes.length}</span></div>
        <div class="total-cell"><span class="sub" style="text-transform:uppercase;letter-spacing:.06em">${t("procCpuSum")}</span><span class="n">${fmtNum(cpuSum)}%</span></div>
        <div class="total-cell"><span class="sub" style="text-transform:uppercase;letter-spacing:.06em">${t("procRamSum")}</span><span class="n">${fmtBytes(memSum)}</span></div>
        <div class="total-cell"><span class="sub" style="text-transform:uppercase;letter-spacing:.06em">${t("procDiskSum")}</span><span class="n">${fmtBps(diskSum)}</span></div>`;
    };
    const fetchDraw = async () => {
      try { data = await api("/api/v1/processes"); } catch { return; }
      drawRows();
    };
    await fetchDraw();
    every(fetchDraw, 15000);
  }

  // ---------- server: projects ----------
  async function loadProjects() {
    try {
      const j = await api("/api/v1/projects");
      S.projects = j.projects || [];
    } catch {}
  }

  async function viewProjects() {
    const app = $("app");
    app.innerHTML = `

      </div>
      <div class="proj-grid" id="pj-grid"></div>`;
    $("pj-new").addEventListener("click", () => { S.tab = "wizard"; startWizard(); render(); });
    const draw = async () => {

      if (S.tab !== "projects" || S.scope !== "server") return;
      $("pj-count").textContent = `${S.projects.length} ${t("projectsN")}`;
      $("pj-grid").innerHTML = S.projects.map((p) => {

        const deploy = p.last_build
          ? `${t("deployAgo", t("agoW", relTime(nowSecs() - p.last_build.created_at)))} · <span style="font-family:var(--mono)">${esc(p.last_build.commit_sha.slice(0, 7))}</span>`
          : t("noDeploy");

          <div class="proj-head">
            <div class="proj-idw">
              <span class="proj-icon" style="background:${techOf(p.tech, p.slug)[1]};color:${techOf(p.tech, p.slug)[2]}">${esc(techOf(p.tech, p.slug)[0])}</span>
              <div style="min-width:0">
                <div class="proj-nm"><b>${esc(p.name)}</b><span class="mini-dot" style="background:${p.running ? "var(--ok)" : "var(--text-3)"}"></span></div>
                <span class="proj-dom">${esc((p.url || "").replace("https://", "") || t("noDomain"))}</span>
              </div>
            </div>
            <span class="pill">${st}</span>

          ${spark}
          <div class="proj-stats">
            <div><div class="res-sub">${t("cpu")}</div><div class="v">${fmtNum(p.cpu_pct)}%</div></div>
            <div><div class="res-sub">RAM</div><div class="v">${fmtBytes(p.mem_bytes)}</div></div>
            <div><div class="res-sub">${t("resourcesN")}</div><div class="v">${p.containers}</div></div>

  // ---------- wizard (4 steps, top stepper) ----------
  function startWizard() {
    S.wiz = {
      step: 1, repos: [], q: "", sel: null, busy: false, error: null,
      created: null,           // POST /projects response
      db: "managed", pg: "17", extUrl: "",
      envRows: [],             // [{key, value, badge}]
      expected: [],
      provision: null, publishing: false, deployPhase: 0, buildStatus: null,
    };
  }

  function wizStepsBar() {
    const meta = [["wsRepo", "wsRepoHint"], ["wsDb", "wsDbHint"], ["wsCreds", "wsCredsHint"], ["wsDeploy", "wsDeployHint"]];
    return `<div class="wsteps">${meta.map(([lbl, hint], i) => {
      const n = i + 1, cur = S.wiz.step === n, done = S.wiz.step > n;
      return `<div class="wstep${cur ? " cur" : ""}${done ? " done" : ""}">
        <span class="wstep-dot">${done ? "✓" : n}</span>
        <span class="wstep-t" title="${esc(t(hint))}">${t(lbl)}</span>
        <span class="wstep-line"></span>
      </div>`;
    }).join("")}</div>`;
  }

  async function viewWizard() {
    if (!S.wiz) startWizard();
    const w = S.wiz;
    const app = $("app");
    app.innerHTML = `
      <div class="row-between" style="margin-bottom:16px">
        <div style="display:flex;align-items:center;gap:12px">
          <button class="icon-btn" id="wz-back-top" aria-label="back">‹</button>
          <div><div class="sub">${t("backTo")}</div><div style="font-size:21px;font-weight:700;letter-spacing:-.01em">${t("newProjTitle")}</div></div>
        </div>
      </div>
      ${wizStepsBar()}
      <div class="dcard" style="margin-top:16px"><div id="wz-body" style="padding:24px 26px"></div></div>
      <div class="row-between" style="margin-top:14px">
        <span class="sub" id="wz-hint"></span>
        <div style="display:flex;gap:10px;align-items:center">
          <button class="btn-ghost" id="wz-prev"></button>
          <button class="btn-primary" id="wz-next"></button>
        </div>
      </div>
      ${w.error ? `<div class="warn-strip" style="margin-top:12px">${esc(w.error)}</div>` : ""}`;
    $("wz-back-top").addEventListener("click", () => leaveWizard());
    $("wz-prev").textContent = w.step === 1 ? t("cancel") : t("back");
    $("wz-prev").addEventListener("click", () => {
      if (w.step === 1) return leaveWizard();
      w.step -= 1; render();
    });
    const next = $("wz-next");
    next.textContent = w.step === 4 ? t("publish") : t("continueBtn");
    next.addEventListener("click", () => wizNext());
    if (w.publishing) { $("wz-prev").hidden = true; next.hidden = true; }
    const body = $("wz-body");
    if (w.step === 1) await wizStep1(body);
    else if (w.step === 2) wizStep2(body);
    else if (w.step === 3) await wizStep3(body);
    else wizStep4(body);
    wizSyncNext();
  }

  function leaveWizard() {
    if (S.wiz && (S.wiz.sel || S.wiz.created) && !S.wiz.provision) {
      if (!confirm(t("confirmLeaveWizard"))) return;
    }
    S.wiz = null; S.tab = "projects"; render();
  }

  function wizSyncNext() {
    const w = S.wiz, next = $("wz-next"), hint = $("wz-hint");
    if (!next) return;
    if (w.step === 1) {
      next.disabled = !w.sel || w.busy;
      hint.textContent = w.sel ? "" : t("choosing");
    } else if (w.step === 2) {
      next.disabled = w.db === "external" && !w.extUrl.trim();
      hint.textContent = "";
    } else if (w.step === 4) {
      next.disabled = w.busy || w.publishing;
      hint.textContent = "";
    } else { next.disabled = false; hint.textContent = ""; }
  }

  async function wizStep1(body) {
    const w = S.wiz;
    body.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:16px">
        <div><div style="font-size:17px;font-weight:700">${t("s1Title")}</div><div class="sub" style="margin-top:3px">${t("s1Sub")}</div></div>
        <div class="search-box">${SEARCH_SVG}<input id="wz-q" placeholder="${esc(t("searchRepos"))}" value="${esc(w.q)}"></div>
        <div class="dcard" style="box-shadow:none"><div id="wz-repos" style="max-height:46vh;overflow-y:auto;overscroll-behavior:contain">${w.repos.length ? "" : `<div class="empty-note">${t("loading")}</div>`}</div></div>
      </div>`;
    const drawRepos = () => {
      const q = w.q.trim().toLowerCase();
      const list = w.repos.filter((r) => !q || `${r.owner}/${r.name}`.toLowerCase().includes(q)).slice(0, 60);
      $("wz-repos").innerHTML = list.map((r) => {
        const key = `${r.owner}/${r.name}`;
        const sel = w.sel === key;
        const langColors = { TypeScript: "var(--accent)", JavaScript: "#eab308", Ruby: "#f2707c", Rust: "#f6902c", HTML: "#ef7a52", Go: "#4fc3f7", Python: "#4fc3f7" };
        return `<div class="wrow${r.already_project ? " dim" : sel ? " sel" : ""}" data-repo="${esc(key)}">
          <span class="idw"><span class="lang-dot" style="background:${langColors[r.language] || "var(--text-3)"}"></span>
            <span style="min-width:0"><span class="wrepo"><span class="ow">${esc(r.owner)}/</span><b>${esc(r.name)}</b></span>
            <div class="wmeta">${esc(r.language || "")}${r.private ? " · privado" : ""}</div></span></span>
          <span class="wmeta" style="flex:none">${r.already_project ? t("alreadyProject") : sel ? t("chosen") : (r.pushed_at ? t("agoW", relTime(nowSecs() - Math.floor(new Date(r.pushed_at).getTime() / 1000))) : "")}</span>
        </div>`;
      }).join("") || `<div class="empty-note">${t("logsEmpty")}</div>`;
      $("wz-repos").querySelectorAll(".wrow:not(.dim)").forEach((row) =>
        row.addEventListener("click", () => { w.sel = row.dataset.repo; w.error = null; drawRepos(); wizSyncNext(); }));
    };
    $("wz-q").addEventListener("input", debounce(() => { w.q = $("wz-q").value; drawRepos(); }, 120));
    if (!w.repos.length) {
      try { w.repos = (await api("/api/v1/github/repos")).repos || []; } catch (e) { w.error = t("wizFail", e.message); }
    }
    drawRepos();
  }

  async function wizNext() {
    const w = S.wiz;
    if (w.step === 1) {
      if (!w.sel || w.busy) return;
      w.busy = true; wizSyncNext();
      const [owner, name] = w.sel.split("/");
      try {
        const j = await api("/api/v1/projects", jbody("POST", { repo_owner: owner, repo_name: name }));
        if (!j.supported) { w.error = t("unsupported", j.language); w.busy = false; render(); return; }
        w.created = j; w.error = null; w.step = 2;
      } catch (e) { w.error = t("wizFail", e.message); }
      w.busy = false; render();
    } else if (w.step === 2) {
      w.step = 3; render();
    } else if (w.step === 3) {
      w.step = 4; render();
    } else if (w.step === 4) {
      await wizPublish();
    }
  }

  function wizStep2(body) {
    const w = S.wiz;
    const slug = w.created?.slug || (w.sel || "").split("/")[1] || "";
    const modes = [["managed", "dbManaged", "dbManagedSub"], ["external", "dbExternal", "dbExternalSub"], ["none", "dbNone", "dbNoneSub"]];
    body.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:18px">
        <div><div style="font-size:17px;font-weight:700">${t("s2Title")}</div><div class="sub" style="margin-top:3px">${t("s2Sub")}</div></div>
        <div class="mode-cards">${modes.map(([k, tt, ss]) =>
          `<div class="mode-card${w.db === k ? " sel" : ""}" data-db="${k}"><b>${t(tt)}</b><span>${t(ss)}</span></div>`).join("")}</div>
        <div id="wz-db-detail"></div>
      </div>`;
    const detail = () => {
      const host = $("wz-db-detail");
      if (w.db === "managed") {
        host.innerHTML = `
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
            <div><div class="label" style="margin-bottom:7px">${t("containerName")}</div>
              <div class="cname-box">${esc(slug)}-db</div></div>
            <div><div class="label" style="margin-bottom:7px">${t("pgVersion")}</div>
              <div class="ver-chips">${["17", "16", "15"].map((v) => `<div class="ver-chip${w.pg === v ? " sel" : ""}" data-pg="${v}">postgres ${v}</div>`).join("")}</div></div>
          </div>
          <div class="warn-strip" style="margin-top:14px;border-color:var(--stroke);background:var(--surface)">${t("backupNote")}</div>
          <div class="cname-box" style="margin-top:14px">DATABASE_URL=postgres://${esc(db_ident(slug))}:••••••••@${esc(slug)}-db:5432/${esc(db_ident(slug))}</div>`;
        host.querySelectorAll("[data-pg]").forEach((c) => c.addEventListener("click", () => { w.pg = c.dataset.pg; detail(); }));
      } else if (w.db === "external") {
        host.innerHTML = `<input class="txt-input" id="wz-ext" style="width:100%;height:44px" placeholder="${esc(t("externalUrlPh"))}" value="${esc(w.extUrl)}">`;
        $("wz-ext").addEventListener("input", () => { w.extUrl = $("wz-ext").value; wizSyncNext(); });
      } else host.innerHTML = "";
      wizSyncNext();
    };
    body.querySelectorAll("[data-db]").forEach((c) => c.addEventListener("click", () => {
      w.db = c.dataset.db;
      body.querySelectorAll("[data-db]").forEach((x) => x.classList.toggle("sel", x.dataset.db === w.db));
      detail();
    }));
    detail();
  }
  const db_ident = (slug) => slug.toLowerCase().replace(/[^a-z0-9]/g, "_").replace(/^_+|_+$/g, "");

  async function wizStep3(body) {
    const w = S.wiz;
    const slug = w.created?.slug;
    if (slug && !w.expected.length && !w._envLoaded) {
      try {
        const j = await api(`/api/v1/projects/${encodeURIComponent(slug)}/env`);
        w.expected = j.expected || [];
        const managed = w.db === "managed";
        w.envRows = w.expected
          .filter((k) => !(managed && k === "DATABASE_URL"))
          .map((k) => ({ key: k, value: "", badge: "fromRepo" }));
      } catch {}
      w._envLoaded = true;
    }
    const draw = () => {
      const n = w.expected.length;
      body.innerHTML = `
        <div style="display:flex;flex-direction:column;gap:16px">
          <div><div style="font-size:17px;font-weight:700">${t("s3Title")}</div>
            <div class="sub" style="margin-top:3px">${n ? t("s3Sub", n) : t("s3SubNone")}</div></div>
          <div class="dcard" style="box-shadow:none">
            ${w.db === "managed" ? `<div class="env-wgrid"><span class="kv-key">DATABASE_URL</span><span class="kv-val">postgres://…</span><span class="tag-managed">${t("managedTag")}</span></div>` : ""}
            <div id="wz-envs"></div>
            <div class="env-wgrid">
              <input class="txt-input" id="wz-ek" placeholder="${esc(t("keyPh"))}" style="text-transform:uppercase">
              <input class="txt-input" id="wz-ev" placeholder="${esc(t("envValuePh"))}">
              <button class="btn-sm" id="wz-eadd">${t("saveBtn")}</button>
            </div>
          </div>
          <div class="drop-env" id="wz-drop">${t("dropEnv")}</div>
          <span class="sub">${t("envCipherNote")}</span>
        </div>`;
      $("wz-envs").innerHTML = w.envRows.map((r, i) => `
        <div class="env-wgrid">
          <span class="kv-key">${esc(r.key)}</span>
          <input class="txt-input" data-ei="${i}" placeholder="${esc(t("envValuePh"))}" value="${esc(r.value)}">
          ${r.value ? `<span class="pill">${t(r.badge)}</span>` : `<span class="tag-missing">${t("toFill")}</span>`}
        </div>`).join("");
      $("wz-envs").querySelectorAll("[data-ei]").forEach((inp) =>
        inp.addEventListener("change", () => { w.envRows[Number(inp.dataset.ei)].value = inp.value; draw(); }));
      $("wz-eadd").addEventListener("click", () => {
        const k = $("wz-ek").value.trim().toUpperCase(), v = $("wz-ev").value;
        if (!k) return;
        const existing = w.envRows.find((r) => r.key === k);
        if (existing) existing.value = v; else w.envRows.push({ key: k, value: v, badge: "fromRepo" });
        draw();
      });
      const drop = $("wz-drop");
      const readEnvFile = (file) => {
        const rd = new FileReader();
        rd.onload = () => {
          String(rd.result).split("\n").forEach((line) => {
            const m = line.match(/^\s*([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*)$/);
            if (!m) return;
            const key = m[1].toUpperCase(), value = m[2].replace(/^["']|["']$/g, "");
            const ex = w.envRows.find((r) => r.key === key);
            if (ex) ex.value = value; else w.envRows.push({ key, value, badge: "fromRepo" });
          });
          draw();
        };
        rd.readAsText(file);
      };
      drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
      drop.addEventListener("dragleave", () => drop.classList.remove("over"));
      drop.addEventListener("drop", (e) => {
        e.preventDefault(); drop.classList.remove("over");
        const f = e.dataTransfer.files?.[0];
        if (f) readEnvFile(f);
      });
      drop.addEventListener("click", () => {
        const inp = document.createElement("input");
        inp.type = "file";
        inp.addEventListener("change", () => inp.files?.[0] && readEnvFile(inp.files[0]));
        inp.click();
      });
    };
    draw();
  }

  function wizStep4(body) {
    const w = S.wiz;
    const slug = w.created?.slug || "";
    const envCount = w.envRows.filter((r) => r.value).length + (w.db === "managed" || w.db === "external" ? 1 : 0);
    const dbLabel = w.db === "managed" ? `${slug}-db · postgres ${w.pg}` : w.db === "external" ? t("dbExternal") : t("sumNone");
    const steps = [
      [t("dCommit"), w.provision ? "done" : w.publishing ? "cur" : ""],
      [t("dSecrets"), w.provision ? "done" : ""],
      [t("dBuild"), w.buildStatus === "success" ? "done" : (w.provision && !w.buildStatus ? "cur" : "")],
      [t("dServer"), w.deployPhase >= 3 ? "done" : (w.buildStatus === "success" ? "cur" : "")],
      [t("dUp"), w.deployPhase >= 4 ? "done" : ""],
    ];
    body.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:18px">
        <div><div style="font-size:17px;font-weight:700">${t("s4Title")}</div><div class="sub" style="margin-top:3px">${t("s4Sub")}</div></div>
        <div class="sum-grid">
          <div class="sum-cell"><span class="label">${t("sumRepo")}</span><div class="v">${esc(w.sel || "")} · ${esc(w.created?.branch || "main")}</div></div>
          <div class="sum-cell"><span class="label">${t("sumDb")}</span><div class="v">${esc(dbLabel)}</div></div>
          <div class="sum-cell"><span class="label">${t("sumDomain")}</span><div class="v">${w.provision?.auto_domain ? esc(w.provision.auto_domain) : t("sumDomainAuto")}</div></div>

  async function wizPublish() {
    const w = S.wiz;
    if (w.publishing || !w.created) return;
    w.publishing = true; w.error = null; render();
    const env = {};
    w.envRows.forEach((r) => { if (r.key && r.value) env[r.key] = r.value; });
    try {
      const bodyReq = { db: w.db, pg_version: w.pg, env };
      if (w.db === "external") bodyReq.database_url = w.extUrl.trim();
      w.provision = await api(`/api/v1/projects/${encodeURIComponent(w.created.slug)}/provision`, jbody("POST", bodyReq));
      render();
      // watch the first deploy: project status flips deploying -> null when live
      const slug = w.created.slug;
      const poll = setInterval(async () => {
        if (!S.wiz || S.tab !== "wizard") { clearInterval(poll); return; }
        try {
          const d = await api(`/api/v1/projects/${encodeURIComponent(slug)}`);
          const lastBuild = (d.builds || [])[0];
          if (lastBuild) w.buildStatus = lastBuild.conclusion || (lastBuild.status === "completed" ? "success" : null);
          if (d.running) { w.deployPhase = 4; clearInterval(poll); await loadProjects(); enterProject(slug); return; }
          if (w.buildStatus === "success") w.deployPhase = 3;
          if (S.tab === "wizard") viewWizard();
        } catch {}
      }, 6000);
      S.timers.push(poll);
    } catch (e) {
      w.publishing = false;
      w.error = t("wizFail", e.message);
      render();
    }
  }

  // ---------- project: database ----------
  async function loadDb() {
    const D = S.db;
    if (D.database === undefined) {
      try { D.database = (await api(`/api/v1/projects/${encodeURIComponent(S.scope)}/database`)).database; } catch { D.database = null; }
    }
    if (D.database && !D.tables.length) {
      try {
        const j = await api(`/api/v1/projects/${encodeURIComponent(S.scope)}/database/tables`);
        D.tables = j.tables || [];
        if (!D.table && D.tables.length) D.table = D.tables[0];
      } catch {}
      // row-count estimates in one pass (postgres only, pg_stat estimates)
      if (D.database.kind === "postgres") {
        try {
          const r = await api(`/api/v1/projects/${encodeURIComponent(S.scope)}/database/query`,
            jbody("POST", { sql: "SELECT relname, n_live_tup FROM pg_stat_user_tables ORDER BY relname" }));
          (r.rows || []).forEach(([name, n]) => { D.counts[name] = Number(n) || 0; });
        } catch {}
      }
    }
  }
