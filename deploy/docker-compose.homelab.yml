# Homelab override (ThinkPad): GHCR image, shared network with cloudflared.
# Use together with docker-compose.yml:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.homelab.yml up -d
services:
  webo:
    image: ghcr.io/axolutions/webo:latest
    container_name: webo
    labels:
      webo.domain: webo.axolutions.com.br
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the container there is no Tailscale interface, so the listener
      # binds to the container's own network; Docker is what restricts who can
      # reach it — see the port mapping below.
      - WEBO_MCP_BIND=0.0.0.0:5051
    ports:
      # The MCP server can operate the machine, so it is published ONLY on the
      # host's Tailscale address. Set WEBO_TAILSCALE_IP in .env (`tailscale ip
      # -4`); without it the default keeps the port on loopback, reachable
      # from the server itself and nowhere else.
      - "${WEBO_TAILSCALE_IP:-127.0.0.1}:5051:5051"
    networks:
      - homelab

networks:
  homelab:
    external: true
